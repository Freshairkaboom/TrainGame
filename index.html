        });

        // ===== LEVER MECHANICS =====
        function toggleLever(type) {
            if (type === 'forward') {
                gameState.levers.forward = !gameState.levers.forward;
                if (gameState.levers.forward) gameState.levers.reverse = false;
            } else if (type === 'reverse') {
                gameState.levers.reverse = !gameState.levers.reverse;
                if (gameState.levers.reverse) gameState.levers.forward = false;
            } else if (type === 'brake') {
                gameState.levers.brake = !gameState.levers.brake;
            }
        }

        function updateLeverVisuals(lever) {
            const type = lever.userData.type;
            const isOn = gameState.levers[type];
            lever.rotation.x = isOn ? Math.PI / 2 : 0.3;
        }

        yellowLever.rotation.x = 0.3;
        greenLever.rotation.x = 0.3;
        redLever.rotation.x = 0.3;

        // ===== PHYSICS & GAME LOOP =====
        function updateTrain(delta) {
            gameState.previousTrainPosition.copy(trainGroup.position);
            gameState.previousTrainRotation = trainGroup.rotation.y;

            if (!gameState.isOnTrain) {
                if (gameState.levers.forward || gameState.levers.reverse || gameState.levers.brake) {
                    gameState.levers.forward = false;
                    gameState.levers.reverse = false;
                    gameState.levers.brake = false;

                    updateLeverVisuals(yellowLever);
                    updateLeverVisuals(greenLever);
                    updateLeverVisuals(redLever);
                }

                if (Math.abs(gameState.trainVelocity) > 0.01) {
                    const stopDirection = gameState.trainVelocity > 0 ? -1 : 1;
                    gameState.trainVelocity += stopDirection * gameState.autoStopDeceleration;

                    if (Math.abs(gameState.trainVelocity) < 0.05) {
                        gameState.trainVelocity = 0;
                    }
                } else {
                    gameState.trainVelocity = 0;
                }
            } else {
                const targetSpeed = gameState.levers.forward ? gameState.trainMaxSpeed :
                                   gameState.levers.reverse ? -gameState.trainMaxSpeed : 0;

                if (gameState.levers.brake) {
                    if (Math.abs(gameState.trainVelocity) > 0.01) {
                        const brakeDirection = gameState.trainVelocity > 0 ? -1 : 1;
                        gameState.trainVelocity += brakeDirection * gameState.brakeDeceleration;
                    } else {
                        gameState.trainVelocity = 0;
                    }
                } else if (targetSpeed !== 0) {
                    if (Math.abs(gameState.trainVelocity - targetSpeed) > 0.1) {
                        gameState.trainVelocity += Math.sign(targetSpeed - gameState.trainVelocity) * gameState.trainAcceleration;
                    }
                } else {
                    if (Math.abs(gameState.trainVelocity) > 0.01) {
                        gameState.trainVelocity -= Math.sign(gameState.trainVelocity) * gameState.trainDeceleration;
                    } else {
                        gameState.trainVelocity = 0;
                    }
                }
            }

            trainTrackDistance -= gameState.trainVelocity * delta;
            const trackTransform = getTrackTransform(trainTrackDistance, currentTrackRoute);

            // If route changed, update distance and route name
            if (trackTransform.routeChanged && trackTransform.newDistance !== undefined) {
                trainTrackDistance = trackTransform.newDistance;
                currentTrackRoute = trackTransform.routeName;
            }

            // Apply strong deceleration when on a final piece (approaching barrier)
            if (trackTransform.currentPiece && trackTransform.currentPiece.type === 'final') {
                // Calculate distance to the END of the final piece
                const distanceToEnd = trackTransform.currentPiece.length - trackTransform.distanceInPiece;

                // Only start decelerating when within 15 units of the barrier
                if (distanceToEnd < 15 && gameState.trainVelocity < 0) {
                    // Moving forward (negative velocity) - apply barrier deceleration
                    const barrierDeceleration = 0.4;
                    gameState.trainVelocity += barrierDeceleration;

                    // If very close to barrier (within 3 units of end), stop completely
                    if (distanceToEnd < 3) {
                        gameState.trainVelocity = 0;
                        gameState.levers.forward = false;
                        updateLeverVisuals(yellowLever);
                    }
                }
            }

            // Prevent reverse movement past the start barrier on main route
            if (currentTrackRoute === 'main' && trainTrackDistance < 15) {
                // On the first piece of the main route (within first 15 units)

                // Only apply barrier logic when moving backward (positive velocity)
                if (gameState.trainVelocity > 0) {
                    // Moving backward - apply barrier deceleration
                    const barrierDeceleration = 0.4;
                    gameState.trainVelocity -= barrierDeceleration;

                    // If very close to start barrier (within 3 units), stop completely
                    if (trainTrackDistance < 3) {
                        gameState.trainVelocity = 0;
                        gameState.levers.reverse = false;
                        updateLeverVisuals(greenLever);
                    }
                }
            }

            trainGroup.position.copy(trackTransform.position);
            trainGroup.rotation.y = -trackTransform.rotation;

            // Update current route if it changed (also handled above for transitions)
            if (trackTransform.routeName && trackTransform.routeName !== currentTrackRoute) {
                currentTrackRoute = trackTransform.routeName;
            }

            // Update cart position
            updateCart(delta);
        }

        function updateCart(delta) {
            if (gameState.cartAttached) {
                // When attached, cart follows train at fixed distance (7 units behind)
                const desiredCartDistance = trainTrackDistance - 7;

                // Check if train is on a final piece and stopped
                const trainTransform = getTrackTransform(trainTrackDistance, currentTrackRoute);
                const isTrainOnFinalPiece = trainTransform.currentPiece && trainTransform.currentPiece.type === 'final';

                if (isTrainOnFinalPiece && gameState.trainVelocity === 0) {
                    // Train stopped on final piece - only allow cart to move backwards (increase distance)
                    gameState.cartTrackDistance = desiredCartDistance;
                } else {
                    // Normal operation - cart follows train
                    gameState.cartTrackDistance = desiredCartDistance;
                }

                cartTrackRoute = currentTrackRoute;
            }

            // Update cart position on track
            const cartTransform = getTrackTransform(gameState.cartTrackDistance, cartTrackRoute);
            cartGroup.position.copy(cartTransform.position);
            cartGroup.rotation.y = -cartTransform.rotation;

            // Update cart route if it changed
            if (cartTransform.routeName && cartTransform.routeName !== cartTrackRoute) {
                cartTrackRoute = cartTransform.routeName;
            }

            // Move cart when grabbed
            if (gameState.cartGrabbed && !gameState.cartAttached) {
                const playerWorldPos = player.getWorldPosition(new THREE.Vector3());
                const couplerWorldPos = new THREE.Vector3(0, 0.6, -2.3);
                cartGroup.localToWorld(couplerWorldPos);

                const playerToCoupler = couplerWorldPos.clone().sub(playerWorldPos);
                const distance = playerToCoupler.length();

                // Define distance zones
                const minDistance = 1.5;  // Too close - push cart away
                const maxDistance = 3.0;  // Too far - pull cart closer
                const releaseDistance = 5.0; // Release if too far

                if (distance > releaseDistance) {
                    // Player too far, release grab
                    gameState.cartGrabbed = false;
                    console.log('Released cart - too far away!');
                } else if (distance > maxDistance) {
                    // Player is far - move cart forward (toward player)
                    gameState.cartTrackDistance += delta * 3.0;
                } else if (distance < minDistance) {
                    // Player is too close - move cart backward (away from player)
                    gameState.cartTrackDistance -= delta * 3.0;
                }
                // else: player is in deadzone (minDistance to maxDistance) - don't move cart

                // Clamp cart distance to valid track range
                gameState.cartTrackDistance = Math.max(0, gameState.cartTrackDistance);
            }
        }

        function updatePlayer(delta) {
            camera.rotation.y = -gameState.mouseMovement.x;
            camera.rotation.x = -gameState.mouseMovement.y;

            const moveSpeed = 5;
            const moveDirection = new THREE.Vector3();

            // Calculate movement direction relative to camera
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
            );
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
            );

            if (gameState.keys['KeyW']) moveDirection.add(forward);
            if (gameState.keys['KeyS']) moveDirection.sub(forward);
            if (gameState.keys['KeyD']) moveDirection.add(right);
            if (gameState.keys['KeyA']) moveDirection.sub(right);

            if (moveDirection.length() > 0) {
                moveDirection.normalize();
                if (gameState.isOnTrain) {
                    // When on train, movement is in train's local space automatically
                    moveDirection.multiplyScalar(moveSpeed * delta);
                    player.position.x += moveDirection.x;
                    player.position.z += moveDirection.z;
                } else {
                    // When off train, use velocity
                    gameState.playerVelocity.x = moveDirection.x * moveSpeed;
                    gameState.playerVelocity.z = moveDirection.z * moveSpeed;
                }
            } else if (!gameState.isOnTrain) {
                gameState.playerVelocity.x *= 0.8;
                gameState.playerVelocity.z *= 0.8;
            }

            // Apply horizontal velocity when not on train
            if (!gameState.isOnTrain) {
                player.position.x += gameState.playerVelocity.x * delta;
                player.position.z += gameState.playerVelocity.z * delta;
            }

            // Apply gravity
            gameState.playerVelocity.y -= 25 * delta;

            // Jump
            if (gameState.keys['Space'] && gameState.canJump) {
                gameState.playerVelocity.y = 7;
                gameState.canJump = false;
            }

            player.position.y += gameState.playerVelocity.y * delta;

            // Collision detection with train - always work in train's local space
            let touchingFloor = false;

            // Get player position in train's local space
            const playerWorldPos = player.getWorldPosition(new THREE.Vector3());
            const playerLocalPos = trainGroup.worldToLocal(playerWorldPos.clone());

            for (const collider of trainColliders) {
                const colliderPos = collider.position.clone();
                const colliderScale = collider.scale.clone();
                const colliderGeometry = collider.geometry;
                const halfSize = new THREE.Vector3(
                    (colliderGeometry.parameters.width || 1) * colliderScale.x / 2,
                    (colliderGeometry.parameters.height || 1) * colliderScale.y / 2,
                    (colliderGeometry.parameters.depth || 1) * colliderScale.z / 2
                );

                const diff = new THREE.Vector3().subVectors(playerLocalPos, colliderPos);
                const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                    if (overlapX < overlapY && overlapX < overlapZ) {
                        playerLocalPos.x += overlapX * Math.sign(diff.x);
                        if (!gameState.isOnTrain) gameState.playerVelocity.x = 0;
                    } else if (overlapY < overlapZ) {
                        playerLocalPos.y += overlapY * Math.sign(diff.y);
                        gameState.playerVelocity.y = 0;
                        if (diff.y > 0) {
                            gameState.canJump = true;
                            if (collider === trainFloor || collider === balconyFloor) {
                                touchingFloor = true;
                            }
                        }
                    } else {
                        playerLocalPos.z += overlapZ * Math.sign(diff.z);
                        if (!gameState.isOnTrain) gameState.playerVelocity.z = 0;
                    }
                }
            }

            // Collision detection with cart (when attached)
            if (gameState.cartAttached) {
                const playerLocalPosCart = cartGroup.worldToLocal(playerWorldPos.clone());
                let cartCollisionDetected = false;

                for (const collider of cartColliders) {
                    const colliderPos = collider.position.clone();
                    const colliderScale = collider.scale.clone();
                    const colliderGeometry = collider.geometry;
                    const halfSize = new THREE.Vector3(
                        (colliderGeometry.parameters.width || 1) * colliderScale.x / 2,
                        (colliderGeometry.parameters.height || 1) * colliderScale.y / 2,
                        (colliderGeometry.parameters.depth || 1) * colliderScale.z / 2
                    );

                    const diff = new THREE.Vector3().subVectors(playerLocalPosCart, colliderPos);
                    const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                    const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                    const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                    if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                        cartCollisionDetected = true;
                        if (overlapX < overlapY && overlapX < overlapZ) {
                            playerLocalPosCart.x += overlapX * Math.sign(diff.x);
                            if (!gameState.isOnTrain) gameState.playerVelocity.x = 0;
                        } else if (overlapY < overlapZ) {
                            playerLocalPosCart.y += overlapY * Math.sign(diff.y);
                            gameState.playerVelocity.y = 0;
                            if (diff.y > 0) {
                                gameState.canJump = true;
                                if (collider === cartFloor) {
                                    touchingFloor = true;
                                }
                            }
                        } else {
                            playerLocalPosCart.z += overlapZ * Math.sign(diff.z);
                            if (!gameState.isOnTrain) gameState.playerVelocity.z = 0;
                        }
                    }
                }

                // Apply cart collision corrections by converting back to train space
                if (cartCollisionDetected) {
                    const cartPosInWorld = cartGroup.localToWorld(playerLocalPosCart.clone());
                    playerLocalPos.copy(trainGroup.worldToLocal(cartPosInWorld));
                }
            }

            // Check if player is inside the train cabin bounds (including balcony and attached cart)
            // Train cabin: x: -1.5 to 1.5, z: -2.4 to 4.1 (includes balcony)
            // Extended to z: 8.0 to cover gap when cart is attached
            let insideTrainBounds = playerLocalPos.x > -1.8 && playerLocalPos.x < 1.8 &&
                                     playerLocalPos.z > -2.7 && playerLocalPos.z < (gameState.cartAttached ? 8.0 : 4.5);

            // Also check if player is inside cart bounds when attached
            if (gameState.cartAttached && !insideTrainBounds) {
                const playerLocalPosCart = cartGroup.worldToLocal(playerWorldPos.clone());
                insideTrainBounds = playerLocalPosCart.x > -1.5 && playerLocalPosCart.x < 1.5 &&
                                   playerLocalPosCart.z > -2.5 && playerLocalPosCart.z < 2.5;
            }

            // Handle parenting and position updates correctly
            if (touchingFloor && !gameState.isOnTrain) {
                // Attach to train and update position in train's local space
                // Get the camera's current world rotation before attaching
                const cameraWorldQuaternion = new THREE.Quaternion();
                camera.getWorldQuaternion(cameraWorldQuaternion);
                const cameraWorldEuler = new THREE.Euler().setFromQuaternion(cameraWorldQuaternion, 'YXZ');

                trainGroup.attach(player);
                gameState.isOnTrain = true;
                player.position.copy(playerLocalPos);

                // Trigger quest on first boarding
                if (!hasEverBoardedTrain && greetQuestCompleted) {
                    hasEverBoardedTrain = true;
                    questActive = true;
                    questTextElement.textContent = 'Attach the train cart to the train';
                    questElement.style.display = 'block';
                }

                // Reset player rotation to zero in the train's local space
                player.rotation.set(0, 0, 0);

                // Calculate what mouseMovement.x should be to maintain the same world rotation
                // When on train: camera world rotation = trainGroup.rotation.y - gameState.mouseMovement.x
                // We want: trainGroup.rotation.y - newMouseMovement.x = cameraWorldEuler.y
                // So: newMouseMovement.x = trainGroup.rotation.y - cameraWorldEuler.y
                gameState.mouseMovement.x = trainGroup.rotation.y - cameraWorldEuler.y;
            } else if (!touchingFloor && gameState.isOnTrain && !insideTrainBounds) {
                // Detach from train only if player is outside the train bounds
                // This prevents detachment when jumping inside the train
                // Get the camera's actual world rotation using Three.js
                const cameraWorldQuaternion = new THREE.Quaternion();
                camera.getWorldQuaternion(cameraWorldQuaternion);
                const cameraWorldEuler = new THREE.Euler().setFromQuaternion(cameraWorldQuaternion, 'YXZ');

                scene.attach(player);
                gameState.isOnTrain = false;

                // Reset player rotation to zero (it's in world space now)
                player.rotation.set(0, 0, 0);

                // Update mouseMovement to maintain the world rotation
                gameState.mouseMovement.x = -cameraWorldEuler.y;
            } else if (gameState.isOnTrain) {
                // Already on train, just update local position
                player.position.copy(playerLocalPos);
            } else {
                // Not on train, convert corrected position back to world space
                const correctedWorldPos = trainGroup.localToWorld(playerLocalPos);
                player.position.copy(correctedWorldPos);
            }

            // Ground collision
            const playerWorldPos2 = player.getWorldPosition(new THREE.Vector3());
            const playerWorldY = playerWorldPos2.y;
            const playerBottom = playerWorldY - playerHeight / 2;

            // Check if player is falling below ground level
            if (playerBottom < 0) {
                // Only snap to ground if not already supported by an elevated platform
                // Platform is at y=0.3, so if player bottom is near that, they're on platform
                const isOnPlatform = playerBottom > 0.15 && playerBottom < 0.45;

                if (!isOnPlatform) {
                    if (gameState.isOnTrain) {
                        // If on train, set in local space
                        const targetWorldPos = new THREE.Vector3(playerWorldPos2.x, playerHeight/2, playerWorldPos2.z);
                        player.position.copy(trainGroup.worldToLocal(targetWorldPos));
                    } else {
                        // If not on train, set in world space
                        player.position.y = playerHeight/2;
                    }
                    gameState.playerVelocity.y = 0;
                    gameState.canJump = true;
                }
            } else if (playerBottom <= 0.05 && playerBottom >= 0) {
                // Player is standing on ground - enable jumping
                gameState.canJump = true;
            }

            // Grass boundary collision (prevent player from entering water)
            if (!gameState.isOnTrain) {
                for (const wall of waterColliders) {
                    const wallPos = wall.position.clone();
                    const wallGeometry = wall.geometry;
                    const halfSize = new THREE.Vector3(
                        wallGeometry.parameters.width / 2,
                        wallGeometry.parameters.height / 2,
                        wallGeometry.parameters.depth / 2
                    );

                    const diff = new THREE.Vector3().subVectors(playerWorldPos2, wallPos);
                    const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                    const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                    const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                    if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                        if (overlapX < overlapZ) {
                            player.position.x += overlapX * Math.sign(diff.x);
                            gameState.playerVelocity.x = 0;
                        } else {
                            player.position.z += overlapZ * Math.sign(diff.z);
                            gameState.playerVelocity.z = 0;
                        }
                    }
                }
            }

            // Environment collision (trees, rocks, bushes, station buildings)
            // Always check walkable platforms (stations), but only check other objects when not on train
            for (const collider of environmentColliders) {
                const colliderPos = collider.position.clone();
                const colliderGeometry = collider.geometry;
                const isWalkable = collider.userData.isWalkable === true;

                // Skip non-walkable collisions if player is on train
                if (!isWalkable && gameState.isOnTrain) continue;

                // Handle box geometries (buildings, platforms)
                if (colliderGeometry.parameters && colliderGeometry.parameters.width !== undefined) {
                    const colliderScale = collider.scale.clone();
                    const colliderRotation = collider.rotation.y;

                    // Get player position relative to collider
                    const localPlayerPos = playerWorldPos2.clone().sub(colliderPos);

                    // Rotate to collider's local space
                    const cosR = Math.cos(-colliderRotation);
                    const sinR = Math.sin(-colliderRotation);
                    const rotatedX = localPlayerPos.x * cosR - localPlayerPos.z * sinR;
                    const rotatedZ = localPlayerPos.x * sinR + localPlayerPos.z * cosR;

                    const halfSize = new THREE.Vector3(
                        (colliderGeometry.parameters.width || 1) * colliderScale.x / 2,
                        (colliderGeometry.parameters.height || 1) * colliderScale.y / 2,
                        (colliderGeometry.parameters.depth || 1) * colliderScale.z / 2
                    );

                    const overlapX = halfSize.x + playerRadius - Math.abs(rotatedX);
                    const overlapY = halfSize.y + playerHeight / 2 - Math.abs(localPlayerPos.y);
                    const overlapZ = halfSize.z + playerRadius - Math.abs(rotatedZ);

                    if (isWalkable) {
                        // For walkable platforms, check horizontal overlap only
                        if (overlapX > 0 && overlapZ > 0) {
                            const topSurface = colliderPos.y + halfSize.y;
                            // Use world position for comparison (playerWorldPos2 is already calculated above)
                            const playerBottom = playerWorldPos2.y - playerHeight / 2;

                            // Check if player is near the platform surface
                            const distanceFromTop = playerBottom - topSurface;

                            // If player is close to platform and falling/standing (not jumping up)
                            if (distanceFromTop >= -0.5 && distanceFromTop <= 0.1 && gameState.playerVelocity.y <= 0) {
                                // Snap player to top of platform (in appropriate space)
                                if (gameState.isOnTrain) {
                                    // Convert world position to train local space
                                    const targetWorldPos = new THREE.Vector3(playerWorldPos2.x, topSurface + playerHeight / 2, playerWorldPos2.z);
                                    player.position.copy(trainGroup.worldToLocal(targetWorldPos));
                                } else {
                                    player.position.y = topSurface + playerHeight / 2;
                                }
                                gameState.playerVelocity.y = 0;
                                gameState.canJump = true;
                            }
                        }
                        continue;
                    }

                    // Non-walkable objects (buildings) - full 3D collision
                    if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                        let pushX = 0, pushZ = 0;
                        if (overlapX < overlapZ) {
                            pushX = overlapX * Math.sign(rotatedX);
                        } else {
                            pushZ = overlapZ * Math.sign(rotatedZ);
                        }

                        // Rotate push back to world space
                        const worldPushX = pushX * cosR + pushZ * sinR;
                        const worldPushZ = -pushX * sinR + pushZ * cosR;

                        player.position.x += worldPushX;
                        player.position.z += worldPushZ;
                        gameState.playerVelocity.x *= 0.5;
                        gameState.playerVelocity.z *= 0.5;
                    }
                    continue;
                }

                // Handle cylinder and sphere colliders
                    let radius, height;
                    if (colliderGeometry.parameters && colliderGeometry.parameters.radiusTop !== undefined) {
                        // Cylinder
                        radius = colliderGeometry.parameters.radiusTop;
                        height = colliderGeometry.parameters.height || 3;
                    } else if (colliderGeometry.parameters && colliderGeometry.parameters.radius !== undefined) {
                        // Sphere or dodecahedron
                        radius = colliderGeometry.parameters.radius;
                        height = radius * 2;
                    } else {
                        continue;
                    }

                    const diff = new THREE.Vector3().subVectors(playerWorldPos2, colliderPos);
                    const horizontalDistance = Math.sqrt(diff.x * diff.x + diff.z * diff.z);
                    const verticalOverlap = (height / 2 + playerHeight / 2) - Math.abs(diff.y);

                    if (horizontalDistance < radius + playerRadius && verticalOverlap > 0) {
                        // Push player away from collider center
                        const pushAngle = Math.atan2(diff.z, diff.x);
                        const pushDistance = (radius + playerRadius) - horizontalDistance;
                        player.position.x += Math.cos(pushAngle) * pushDistance;
                        player.position.z += Math.sin(pushAngle) * pushDistance;
                        gameState.playerVelocity.x *= 0.5;
                        gameState.playerVelocity.z *= 0.5;
                    }
            }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Check for horn rope interaction
            const hornIntersects = raycaster.intersectObjects(trainGroup.children, true);
            let showHornPrompt = false;
            if (hornIntersects.length > 0) {
                let hornObj = hornIntersects[0].object;
                while (hornObj.parent && !hornObj.userData.isHornRope) {
                    hornObj = hornObj.parent;
                }
                if (hornObj.userData.isHornRope) {
                    showHornPrompt = true;
                }
            }

            // Check for lever interactions
            const leverIntersects = raycaster.intersectObjects(levers, true);

            // Check for track switch interactions
            const switchIntersects = raycaster.intersectObjects(trackSwitches, true);

            // Check for NPC interaction
            let showNpcPrompt = false;
            if (npcGroup) {
                const npcIntersects = raycaster.intersectObjects(npcGroup.children, true);
                if (npcIntersects.length > 0 && npcIntersects[0].distance < 3) {
                    showNpcPrompt = true;
                }
            }

            // Check for coupler interaction
            let showCouplerPrompt = false;
            const couplerIntersects = raycaster.intersectObjects(cartGroup.children, true);
            if (couplerIntersects.length > 0) {
                let couplerObj = couplerIntersects[0].object;
                while (couplerObj.parent && !couplerObj.userData.isCoupler) {
                    couplerObj = couplerObj.parent;
                }
                if (couplerObj.userData.isCoupler && couplerIntersects[0].distance < 3) {
                    showCouplerPrompt = true;
                }
            }

            // Check for train connector interaction
            let showTrainConnectorPrompt = false;
            let canAttachToTrain = false;
            const trainConnectorIntersects = raycaster.intersectObjects(trainGroup.children, true);
            if (trainConnectorIntersects.length > 0) {
                let connectorObj = trainConnectorIntersects[0].object;
                while (connectorObj.parent && !connectorObj.userData.isTrainConnector) {
                    connectorObj = connectorObj.parent;
                }
                if (connectorObj.userData.isTrainConnector && trainConnectorIntersects[0].distance < 3) {
                    showTrainConnectorPrompt = true;

                    // Check if cart is grabbed and close enough to attach
                    if (gameState.cartGrabbed && !gameState.cartAttached) {
                        const trainConnectorPos = new THREE.Vector3(0, 0.6, 4.3);
                        trainGroup.localToWorld(trainConnectorPos);

                        const cartCouplerPos = new THREE.Vector3(0, 0.6, -2.3);
                        cartGroup.localToWorld(cartCouplerPos);

                        const connectorDistance = trainConnectorPos.distanceTo(cartCouplerPos);
                        if (connectorDistance < 0.8) {
                            canAttachToTrain = true;
                        }
                    }
                }
            }

            if (showHornPrompt) {
                interactionPrompt.textContent = 'Click to toot the horn';
                interactionPrompt.style.display = 'block';
            } else if (showTrainConnectorPrompt && canAttachToTrain) {
                interactionPrompt.textContent = 'Click to attach';
                interactionPrompt.style.display = 'block';
            } else if (showCouplerPrompt) {
                if (gameState.cartAttached) {
                    interactionPrompt.textContent = 'Click to detach';
                } else if (gameState.cartGrabbed) {
                    interactionPrompt.textContent = 'Click to release';
                } else {
                    interactionPrompt.textContent = 'Click to grab';
                }
                interactionPrompt.style.display = 'block';
            } else if (showNpcPrompt) {
                interactionPrompt.textContent = 'Click to talk';
                interactionPrompt.style.display = 'block';
            } else if (leverIntersects.length > 0 || switchIntersects.length > 0) {
                interactionPrompt.textContent = 'Click to Toggle';
                interactionPrompt.style.display = 'block';
            } else {
                interactionPrompt.style.display = 'none';
            }
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Only update game state if not paused
            if (!gameState.isPaused) {
                updateTrain(delta);
                updatePlayer(delta);

                // Update NPC rotation to face player (head only, or body if needed)
                if (npcGroup && npcHeadGroup && npcStationBuilding1Pos) {
                    const playerWorldPos = new THREE.Vector3();
                    player.getWorldPosition(playerWorldPos);

                    // Check if player is inside station building
                    const buildingCos = Math.cos(npcStationAngle);
                    const buildingSin = Math.sin(npcStationAngle);
                    const dx = playerWorldPos.x - npcStationBuilding1Pos.x;
                    const dz = playerWorldPos.z - npcStationBuilding1Pos.z;
                    const localX = dx * buildingCos + dz * buildingSin;
                    const localZ = -dx * buildingSin + dz * buildingCos;

                    const isInStation = Math.abs(localX) < npcStationBuilding1Width / 2 &&
                                       Math.abs(localZ) < npcStationBuilding1Depth / 2 &&
                                       playerWorldPos.y > 0.1 && playerWorldPos.y < 4.5;

                    const rotationSpeed = 2.0; // Radians per second
                    const maxHeadRotation = Math.PI / 3; // 60 degrees

                    if (isInStation) {
                        // First time player enters - start wave animation and dialogue
                        if (!npcHasMetPlayer) {
                            npcHasMetPlayer = true;
                            npcIsWaving = true;
                            npcWaveTime = 0;
                            npcShowingDialogue = true;
                            npcDialogueCharIndex = 0;
                            npcDialogueProgress = 0;
                        }

                        // Player is in station - look at player
                        const npcWorldPos = new THREE.Vector3();
                        npcGroup.getWorldPosition(npcWorldPos);

                        // Update pupils to look at player
                        if (npcLeftPupil && npcRightPupil) {
                            const npcHeadWorldPos = new THREE.Vector3();
                            npcHeadGroup.getWorldPosition(npcHeadWorldPos);

                            // Calculate direction from head to player in head's local space
                            const headToPlayer = playerWorldPos.clone().sub(npcHeadWorldPos);
                            const headWorldQuaternion = new THREE.Quaternion();
                            npcHeadGroup.getWorldQuaternion(headWorldQuaternion);
                            headToPlayer.applyQuaternion(headWorldQuaternion.invert());
                            headToPlayer.normalize();

                            // Calculate pupil offset (constrain to eye bounds)
                            const maxPupilOffset = 0.012;
                            const pupilOffsetX = Math.max(-maxPupilOffset, Math.min(maxPupilOffset, headToPlayer.x * 0.018));
                            const pupilOffsetY = Math.max(-maxPupilOffset, Math.min(maxPupilOffset, headToPlayer.y * 0.018));

                            // Update pupil positions (adjusted for new eye positions)
                            npcLeftPupil.position.set(-0.06 + pupilOffsetX, 0.04 + pupilOffsetY, 0.18);
                            npcRightPupil.position.set(0.06 + pupilOffsetX, 0.04 + pupilOffsetY, 0.18);
                        }

                        const playerDx = playerWorldPos.x - npcWorldPos.x;
                        const playerDz = playerWorldPos.z - npcWorldPos.z;
                        const targetAbsoluteAngle = Math.atan2(playerDx, playerDz);

                        // Calculate relative angle from body
                        let relativeAngle = targetAbsoluteAngle - npcGroup.rotation.y;
                        while (relativeAngle > Math.PI) relativeAngle -= 2 * Math.PI;
                        while (relativeAngle < -Math.PI) relativeAngle += 2 * Math.PI;

                        if (Math.abs(relativeAngle) > maxHeadRotation) {
                            // Need to rotate body too
                            let bodyAngleDiff = targetAbsoluteAngle - npcGroup.rotation.y;
                            while (bodyAngleDiff > Math.PI) bodyAngleDiff -= 2 * Math.PI;
                            while (bodyAngleDiff < -Math.PI) bodyAngleDiff += 2 * Math.PI;

                            const bodyRotationStep = Math.sign(bodyAngleDiff) * Math.min(Math.abs(bodyAngleDiff), rotationSpeed * delta);
                            npcGroup.rotation.y += bodyRotationStep;

                            // Head rotation gradually returns to center as body turns
                            let headAngleDiff = -npcHeadGroup.rotation.y;
                            const headRotationStep = Math.sign(headAngleDiff) * Math.min(Math.abs(headAngleDiff), rotationSpeed * 2 * delta);
                            npcHeadGroup.rotation.y += headRotationStep;
                        } else {
                            // Only rotate head
                            let headAngleDiff = relativeAngle - npcHeadGroup.rotation.y;
                            while (headAngleDiff > Math.PI) headAngleDiff -= 2 * Math.PI;
                            while (headAngleDiff < -Math.PI) headAngleDiff += 2 * Math.PI;

                            const headRotationStep = Math.sign(headAngleDiff) * Math.min(Math.abs(headAngleDiff), rotationSpeed * 2 * delta);
                            npcHeadGroup.rotation.y += headRotationStep;
                        }
                    } else {
                        // Player left station - return to initial position
                        let bodyAngleDiff = npcInitialRotation - npcGroup.rotation.y;
                        while (bodyAngleDiff > Math.PI) bodyAngleDiff -= 2 * Math.PI;
                        while (bodyAngleDiff < -Math.PI) bodyAngleDiff += 2 * Math.PI;

                        const bodyRotationStep = Math.sign(bodyAngleDiff) * Math.min(Math.abs(bodyAngleDiff), rotationSpeed * delta);
                        npcGroup.rotation.y += bodyRotationStep;

                        // Head returns to center
                        let headAngleDiff = -npcHeadGroup.rotation.y;
                        const headRotationStep = Math.sign(headAngleDiff) * Math.min(Math.abs(headAngleDiff), rotationSpeed * 2 * delta);
                        npcHeadGroup.rotation.y += headRotationStep;
                    }
                }

                // Update wave animation
                if (npcIsWaving && npcWaveArm && npcWaveHand) {
                    npcWaveTime += delta;
                    const waveDuration = 2.5; // Total wave duration in seconds

                    if (npcWaveTime < waveDuration) {
                        const progress = npcWaveTime / waveDuration;

                        // Raise arm gradually, then wave, then lower
                        let armRotation = 0;
                        let handRotation = 0;

                        if (progress < 0.2) {
                            // Raise arm (0-0.2) - rotate on Z axis to raise to the side
                            const raiseProgress = progress / 0.2;
                            armRotation = -Math.PI * 0.75 * raiseProgress; // Raise arm higher (135 degrees)
                        } else if (progress < 0.8) {
                            // Wave (0.2-0.8) - rotate hand side to side
                            armRotation = -Math.PI * 0.75;
                            const waveProgress = (progress - 0.2) / 0.6;
                            handRotation = Math.sin(waveProgress * Math.PI * 4) * 0.5; // 4 waves
                        } else {
                            // Lower arm (0.8-1.0)
                            const lowerProgress = (progress - 0.8) / 0.2;
                            armRotation = -Math.PI * 0.75 * (1 - lowerProgress);
                        }

                        npcWaveArm.rotation.z = armRotation; // Use Z axis for raising arm to side
                        npcWaveHand.rotation.x = handRotation; // Use X axis for waving motion

                        // Calculate hand position at end of rotated arm
                        const armLength = 0.2; // Half the arm height (0.4 / 2)
                        const armBaseX = -0.275;
                        const armBaseY = 0.6;

                        // When arm rotates on Z axis, calculate the end position
                        const handX = armBaseX + Math.sin(armRotation) * armLength;
                        const handY = armBaseY - Math.cos(armRotation) * armLength;

                        npcWaveHand.position.set(handX, handY, 0);
                    } else {
                        // Wave complete - return to rest position
                        npcIsWaving = false;
                        npcWaveArm.rotation.z = 0;
                        npcWaveHand.rotation.x = 0;
                        npcWaveHand.position.set(-0.275, 0.325, 0);
                    }
                }

                // Update dialogue box
                if (npcShowingDialogue && npcDialogueElement && npcGroup) {
                    const typeSpeed = 0.08; // seconds per character
                    npcDialogueProgress += delta;

                    // Typewriter effect
                    const targetCharIndex = Math.floor(npcDialogueProgress / typeSpeed);
                    if (targetCharIndex > npcDialogueCharIndex && npcDialogueCharIndex < npcDialogueText.length) {
                        npcDialogueCharIndex = Math.min(targetCharIndex, npcDialogueText.length);
                        npcDialogueElement.textContent = npcDialogueText.substring(0, npcDialogueCharIndex);
                        npcDialogueElement.style.display = 'block';
                    }

                    // Position dialogue box above NPC
                    const npcWorldPos = new THREE.Vector3();
                    npcGroup.getWorldPosition(npcWorldPos);
                    npcWorldPos.y += 1.3; // Position above head

                    const screenPos = npcWorldPos.project(camera);
                    const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-(screenPos.y) * 0.5 + 0.5) * window.innerHeight;

                    npcDialogueElement.style.left = x + 'px';
                    npcDialogueElement.style.top = y + 'px';
                    npcDialogueElement.style.transform = 'translate(-50%, -100%)';

                    // Hide dialogue after complete + 2 seconds
                    if (npcDialogueCharIndex >= npcDialogueText.length) {
                        if (npcDialogueCompleteTime === 0) {
                            npcDialogueCompleteTime = currentTime;

                            // Complete greeting quest when dialogue finishes
                            if (questActive && !greetQuestCompleted) {
                                greetQuestCompleted = true;
                                questTextElement.innerHTML = '<span style="color: #4ade80;">✓ Say hello to the train station manager</span>';
                                setTimeout(() => {
                                    questElement.style.display = 'none';
                                    questActive = false;
                                }, 3000);
                            }
                        } else if (currentTime - npcDialogueCompleteTime > 2000) {
                            npcShowingDialogue = false;
                            npcDialogueElement.style.display = 'none';
                            npcDialogueCompleteTime = 0;
                        }
                    }
                } else if (npcDialogueElement && !npcShowingDialogue) {
                    npcDialogueElement.style.display = 'none';
                }
            }

            renderer.render(scene, camera);
        }


        animate();

        // Fade out version display after 3 seconds
        setTimeout(() => {
            const versionEl = document.getElementById('version');
            versionEl.style.opacity = '0';
            setTimeout(() => versionEl.style.display = 'none', 1000);
        }, 3000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
