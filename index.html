<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Driving Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
        }
        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            font-size: 16px;
        }
        #version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            opacity: 1;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructions">
        <strong>Controls:</strong><br>
        WASD - Move<br>
        Space - Jump<br>
        Mouse - Look Around<br>
        Click - Interact with Levers & Switches<br>
        F - Toggle Instructions<br>
        Esc - Pause/Unpause<br>
        <br>
        <strong>Levers:</strong><br>
        🟡 Yellow - Reverse<br>
        🟢 Green - Forward<br>
        🔴 Red - Brake<br>
        <br>
        🟠 Track Switches - Change Routes
    </div>
    <div id="pause-overlay" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0, 0, 0, 0.9); padding: 30px 60px; border-radius: 10px; font-size: 32px; z-index: 100;">
        PAUSED
    </div>
    <div id="interaction-prompt">Click to Toggle</div>
    <div id="version">v1.10</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== GAME STATE =====
        const gameState = {
            keys: {},

            playerVelocity: new THREE.Vector3(),
            isOnTrain: false,
            canJump: false,
            trainVelocity: 0,
            trainMaxSpeed: 15,
            trainAcceleration: 0.08,
            trainDeceleration: 0.05,
            brakeDeceleration: 0.15,
            autoStopDeceleration: 0.3,
            previousTrainPosition: new THREE.Vector3(),
            previousTrainRotation: 0,
            isPaused: false,
            showInstructions: true,
            levers: {
                forward: false,
                reverse: false,
                brake: false

            cartAttached: false,
            cartTrackDistance: 20  // Start 20 units behind train
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';

        // Create player object and parent camera to it
        const player = new THREE.Object3D();
        player.position.set(0, 1.6, 5);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);

        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // ===== GROUND ===== (will be created after tracks are built)

        const frontWallTop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 0.2), wallMaterial);

        backWallTop.position.set(0, 2.25, 2.4);

        trainGroup.add(backWallTop);

        // Back door frame

        const backDoorFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 0.15), doorFrameMaterial);
        backDoorFrameLeft.position.set(-0.5, 1.4, 2.35);
        trainGroup.add(backDoorFrameLeft);

        const backDoorFrameRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 0.15), doorFrameMaterial);
        backDoorFrameRight.position.set(0.5, 1.4, 2.35);
        trainGroup.add(backDoorFrameRight);

        // Balcony floor
        const balconyFloorGeometry = new THREE.BoxGeometry(2.0, 0.1, 1.5);
        const balconyFloorMaterial = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
        const balconyFloor = new THREE.Mesh(balconyFloorGeometry, balconyFloorMaterial);
        balconyFloor.position.set(0, 0.3, 3.25);

        trainGroup.add(balconyFloor);
        trainColliders.push(balconyFloor);

        // Balcony railings
        const railingMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });

        // Left railing
        const leftRailing = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 1.5), railingMaterial);
        leftRailing.position.set(-1.0, 0.7, 3.25);
        leftRailing.castShadow = true;
        trainGroup.add(leftRailing);
        trainColliders.push(leftRailing);

        // Right railing
        const rightRailing = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 1.5), railingMaterial);
        rightRailing.position.set(1.0, 0.7, 3.25);
        rightRailing.castShadow = true;
        trainGroup.add(rightRailing);
        trainColliders.push(rightRailing);

        // Back railing
        const backRailing = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 0.1), railingMaterial);
        backRailing.position.set(0, 0.7, 4.0);
        backRailing.castShadow = true;
        trainGroup.add(backRailing);
        trainColliders.push(backRailing);

        // Railing top bar
        const railingTop = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.1), railingMaterial);
        railingTop.position.set(0, 1.0, 4.0);
        trainGroup.add(railingTop);

        const railingTopLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.5), railingMaterial);
        railingTopLeft.position.set(-1.0, 1.0, 3.25);
        trainGroup.add(railingTopLeft);

        const railingTopRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.5), railingMaterial);
        railingTopRight.position.set(1.0, 1.0, 3.25);
        trainGroup.add(railingTopRight);

        // Left wall (with door opening)
        const leftWallFront = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.0, 2), wallMaterial);
        leftWallFront.position.set(-1.2, 1.3, -1.4);
        leftWallFront.castShadow = true;
        trainGroup.add(leftWallFront);
        trainColliders.push(leftWallFront);

        const leftWallBack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.0, 2), wallMaterial);
        leftWallBack.position.set(-1.2, 1.3, 1.4);
        leftWallBack.castShadow = true;
        trainGroup.add(leftWallBack);
        trainColliders.push(leftWallBack);

        // Left door frame (orange)
        const leftDoorFrameTop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.8), doorFrameMaterial);
        leftDoorFrameTop.position.set(-1.325, 2.3, 0);
        trainGroup.add(leftDoorFrameTop);

        const leftDoorFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.8), doorFrameMaterial);
        leftDoorFrameBottom.position.set(-1.325, 0.35, 0);
        trainGroup.add(leftDoorFrameBottom);

        const leftDoorFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.85, 0.1), doorFrameMaterial);
        leftDoorFrameLeft.position.set(-1.325, 1.375, -0.4);
        trainGroup.add(leftDoorFrameLeft);

        const leftDoorFrameRight = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.85, 0.1), doorFrameMaterial);
        leftDoorFrameRight.position.set(-1.325, 1.375, 0.4);
        trainGroup.add(leftDoorFrameRight);

        // Right wall (with window opening)
        const rightWallBottom = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 4.8), wallMaterial);
        rightWallBottom.position.set(1.2, 0.6, 0);
        rightWallBottom.castShadow = true;
        rightWallBottom.receiveShadow = true;
        trainGroup.add(rightWallBottom);
        trainColliders.push(rightWallBottom);

        const rightWallTop = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 4.8), wallMaterial);
        rightWallTop.position.set(1.2, 1.9, 0);
        rightWallTop.castShadow = true;
        rightWallTop.receiveShadow = true;
        trainGroup.add(rightWallTop);
        trainColliders.push(rightWallTop);

        const rightWallFront = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.48), wallMaterial);
        rightWallFront.position.set(1.2, 1.2, -2.16);
        rightWallFront.castShadow = true;
        trainGroup.add(rightWallFront);
        trainColliders.push(rightWallFront);

        const rightWallBack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.48), wallMaterial);
        rightWallBack.position.set(1.2, 1.2, 2.16);
        rightWallBack.castShadow = true;
        trainGroup.add(rightWallBack);
        trainColliders.push(rightWallBack);

        // Right window frame
        const rightWindowFrameTop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 3.84), windowFrameMaterial);
        rightWindowFrameTop.position.set(1.225, 1.45, 0);
        trainGroup.add(rightWindowFrameTop);

        const rightWindowFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 3.84), windowFrameMaterial);
        rightWindowFrameBottom.position.set(1.225, 0.95, 0);
        trainGroup.add(rightWindowFrameBottom);

        const rightWindowFrameFront = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.1), windowFrameMaterial);
        rightWindowFrameFront.position.set(1.225, 1.2, -1.92);
        trainGroup.add(rightWindowFrameFront);

        const rightWindowFrameBack = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.1), windowFrameMaterial);
        rightWindowFrameBack.position.set(1.225, 1.2, 1.92);
        trainGroup.add(rightWindowFrameBack);

        // Cabin roof
        const roofGeometry = new THREE.BoxGeometry(2.6, 0.3, 5);
        const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.position.set(0, 2.45, 0);
        roof.castShadow = true;
        trainGroup.add(roof);
        trainColliders.push(roof);

        // Train floor
        const floorGeometry = new THREE.BoxGeometry(2.4, 0.2, 5);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
        const trainFloor = new THREE.Mesh(floorGeometry, floorMaterial);
        trainFloor.position.y = 0.3;
        trainFloor.castShadow = true;
        trainFloor.receiveShadow = true;
        trainGroup.add(trainFloor);
        trainColliders.push(trainFloor);

        // Wheels
        const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2c2c });
        const wheelPositions = [
            { x: -1.3, z: 1.5 },
            { x: 1.3, z: 1.5 },
            { x: -1.3, z: -1.5 },
            { x: 1.3, z: -1.5 }
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos.x, 0.4, pos.z);
            wheel.castShadow = true;
            trainGroup.add(wheel);
        });

        // ===== TRAIN TRACKS =====
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
        const railMaterial = new THREE.MeshStandardMaterial({ color: 0x707070 });
        const trackWidth = 2.6;

        class TrackPiece {
            constructor() {
                this.startPos = new THREE.Vector3();
                this.startDir = new THREE.Vector3(0, 0, -1);
                this.endPos = new THREE.Vector3();
                this.endDir = new THREE.Vector3(0, 0, -1);
                this.length = 0;
                this.type = 'straight';
                this.switchState = 'straight'; // For switcher pieces
                this.targetRoute = null; // For final pieces
            }

            getTransformAt(t) {
                const position = new THREE.Vector3();
                const direction = new THREE.Vector3();

                if (this.type === 'straight' || this.type === 'final') {
                    const alpha = t / this.length;
                    position.lerpVectors(this.startPos, this.endPos, alpha);
                    direction.copy(this.startDir);
                } else if (this.type === 'curve') {
                    const alpha = t / this.length;
                    const angle = this.startAngle + (this.endAngle - this.startAngle) * alpha;
                    position.set(
                        this.center.x + this.radius * Math.cos(angle),
                        0,
                        this.center.z + this.radius * Math.sin(angle)
                    );
                    // Use exact same formula as endDir
                    const tangentAngle = angle + (this.turnAngle > 0 ? Math.PI / 2 : -Math.PI / 2);
                    direction.set(Math.cos(tangentAngle), 0, Math.sin(tangentAngle));
                } else if (this.type === 'switcher') {
                    // Use the active path based on switch state
                    const activePath = this.switchState === 'straight' ? this.straightPath : this.alternatePath;
                    return activePath.getTransformAt(t);
                }

                return { position, direction };
            }
        }

        function createStraightPiece(length, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'straight';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.length = length;
            piece.endPos.copy(startPos).add(piece.startDir.clone().multiplyScalar(length));
            piece.endDir.copy(piece.startDir);
            return piece;
        }

        function createCurvePiece(radius, angle, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'curve';
            piece.radius = radius;
            piece.turnAngle = angle;
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();

            const right = new THREE.Vector3(-startDir.z, 0, startDir.x).normalize();
            const turnDirection = angle > 0 ? 1 : -1;
            piece.center = startPos.clone().add(right.multiplyScalar(radius * turnDirection));

            const toStart = new THREE.Vector3().subVectors(startPos, piece.center);
            piece.startAngle = Math.atan2(toStart.z, toStart.x);
            piece.endAngle = piece.startAngle + angle;

            piece.length = Math.abs(radius * angle);

            piece.endPos.set(
                piece.center.x + radius * Math.cos(piece.endAngle),
                0,
                piece.center.z + radius * Math.sin(piece.endAngle)
            );
            const tangentAngle = piece.endAngle + (angle > 0 ? Math.PI / 2 : -Math.PI / 2);
            piece.endDir.set(Math.cos(tangentAngle), 0, Math.sin(tangentAngle));

            return piece;
        }

        function createFinalPiece(length, startPos, startDir, targetRoute = null) {
            const piece = new TrackPiece();
            piece.type = 'final';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.length = length;
            piece.endPos.copy(startPos).add(piece.startDir.clone().multiplyScalar(length));
            piece.endDir.copy(piece.startDir);
            piece.targetRoute = targetRoute;
            return piece;
        }

        function createSwitcherPiece(straightLength, curveRadius, curveAngle, startPos, startDir, targetRoute = null) {
            const piece = new TrackPiece();
            piece.type = 'switcher';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.switchState = 'straight'; // Default to straight
            piece.targetRoute = targetRoute; // Which route the alternate path leads to

            // Create the straight path
            piece.straightPath = createStraightPiece(straightLength, startPos, startDir);

            // Create the alternate curved path
            piece.alternatePath = createCurvePiece(curveRadius, curveAngle, startPos, startDir);

            // Use straight path by default for end position/direction
            piece.length = piece.straightPath.length;
            piece.endPos.copy(piece.straightPath.endPos);
            piece.endDir.copy(piece.straightPath.endDir);

            return piece;
        }

        // ===== TRACK CONFIGURATION =====
        // Track Definition: 1=straight, 2=right_curve, 3=left_curve, 6=final piece
        // Switcher format: {type:4/5, targetRoute:'routeName'}
        // Final piece format: '6' - stops forward movement with red barrier (allows reverse)
        // Edit this configuration to create your track layout
        const TRACK_ROUTES = {
            main: {
                pattern: [
                    '1', '1',
                    {type: '4', targetRoute: 'branch'},  // Switcher that leads to branch route
                    '1', '1', '2', '1', '2', '1', '1', '1', '1', '1', '2', '1', '6'
                ],
                startPos: new THREE.Vector3(0, 0, 0),
                startDir: new THREE.Vector3(0, 0, -1)
            },
            branch: {
                pattern: ['1', '1', '1', '2', '2', '1', '1', '6'],
                // Start position will be set by the switcher
                startPos: null,
                startDir: null
            }
        };

        const TRACK_PARAMS = {
            straightLength: 50,
            curveRadius: 30,
            curveAngle: Math.PI / 2  // 90 degrees
        };

        // Array to hold all physical switch objects
        const trackSwitches = [];

        // Object to hold all track routes
        const trackRoutes = {};
        let currentTrackRoute = 'main';

        // Track parent relationships for bidirectional switching
        const routeParentInfo = {}; // Maps branch route name to {parentRoute, switcherPiece}

        // Parse and build track from pattern
        function buildRouteFromPattern(pattern, startPos, startDir, params) {
            const trackPieces = [];
            let currentPos = startPos.clone();
            let currentDir = startDir.clone();

            pattern.forEach(segment => {
                let piece;
                let segmentType = typeof segment === 'object' ? segment.type : segment;
                let targetRoute = typeof segment === 'object' ? segment.targetRoute : null;

                switch(segmentType) {
                    case '1': // Straight
                        piece = createStraightPiece(params.straightLength, currentPos, currentDir);
                        break;
                    case '2': // Right curve
                        piece = createCurvePiece(params.curveRadius, params.curveAngle, currentPos, currentDir);
                        break;
                    case '3': // Left curve
                        piece = createCurvePiece(params.curveRadius, -params.curveAngle, currentPos, currentDir);
                        break;
                    case '4': // Switcher with right turn option
                        piece = createSwitcherPiece(params.straightLength, params.curveRadius, params.curveAngle, currentPos, currentDir, targetRoute);
                        break;
                    case '5': // Switcher with left turn option
                        piece = createSwitcherPiece(params.straightLength, params.curveRadius, -params.curveAngle, currentPos, currentDir, targetRoute);
                        break;
                    case '6': // Final piece (transition piece)
                        piece = createFinalPiece(params.straightLength, currentPos, currentDir, targetRoute);
                        break;
                    default:
                        console.warn(`Unknown track segment: ${segmentType}`);
                        return;
                }

                if (piece) {
                    trackPieces.push(piece);
                    currentPos.copy(piece.endPos);
                    currentDir.copy(piece.endDir);

                    // If this is a switcher with a target route, set up the branch route's start
                    if (piece.type === 'switcher' && piece.targetRoute && TRACK_ROUTES[piece.targetRoute]) {
                        TRACK_ROUTES[piece.targetRoute].startPos = piece.alternatePath.endPos.clone();
                        TRACK_ROUTES[piece.targetRoute].startDir = piece.alternatePath.endDir.clone();
                        // Store parent route info for reverse transitions
                        routeParentInfo[piece.targetRoute] = {
                            parentRoute: 'main',
                            switcherPiece: piece
                        };
                    }
                }
            });

            return trackPieces;
        }

        // Build all track routes
        for (const [routeName, routeConfig] of Object.entries(TRACK_ROUTES)) {
            if (routeConfig.startPos && routeConfig.startDir) {
                trackRoutes[routeName] = buildRouteFromPattern(
                    routeConfig.pattern,
                    routeConfig.startPos,
                    routeConfig.startDir,
                    TRACK_PARAMS
                );
            }
        }

        // Build routes that depend on switchers (branch routes)
        for (const [routeName, routeConfig] of Object.entries(TRACK_ROUTES)) {
            if (!trackRoutes[routeName] && routeConfig.startPos && routeConfig.startDir) {
                trackRoutes[routeName] = buildRouteFromPattern(
                    routeConfig.pattern,
                    routeConfig.startPos,
                    routeConfig.startDir,
                    TRACK_PARAMS
                );
            }
        }

        const trackPieces = trackRoutes['main'];

        // Build a map of all track pieces to their routes for connection detection
        const pieceToRouteMap = new Map();
        for (const [routeName, route] of Object.entries(trackRoutes)) {
            if (route) {
                route.forEach((piece, index) => {
                    pieceToRouteMap.set(piece, { routeName, index });
                });
            }
        }

        // Render all track routes
        for (const [routeName, route] of Object.entries(trackRoutes)) {
            if (route) {
                route.forEach(piece => renderTrackPiece(piece));
            }
        }

        // ===== CREATE DYNAMIC GROUND BASED ON TRACK BOUNDS =====
        function calculateTrackBounds() {
            const bounds = {
                minX: Infinity,
                maxX: -Infinity,
                minZ: Infinity,
                maxZ: -Infinity
            };

            // Sample points along all track pieces to find bounds
            for (const [routeName, route] of Object.entries(trackRoutes)) {
                if (route) {
                    route.forEach(piece => {
                        // Sample multiple points along each piece
                        const samples = 20;
                        for (let i = 0; i <= samples; i++) {
                            const t = (i / samples) * piece.length;
                            const transform = piece.getTransformAt(t);
                            bounds.minX = Math.min(bounds.minX, transform.position.x);
                            bounds.maxX = Math.max(bounds.maxX, transform.position.x);
                            bounds.minZ = Math.min(bounds.minZ, transform.position.z);
                            bounds.maxZ = Math.max(bounds.maxZ, transform.position.z);
                        }
                    });
                }
            }

            return bounds;
        }

        const trackBounds = calculateTrackBounds();
        const grassMargin = 20; // 20 units grass margin in every direction
        const waterMargin = 50; // 50 units total (20 grass + 30 water)

        const groundWidth = (trackBounds.maxX - trackBounds.minX) + (grassMargin * 2);
        const groundDepth = (trackBounds.maxZ - trackBounds.minZ) + (grassMargin * 2);
        const groundCenterX = (trackBounds.minX + trackBounds.maxX) / 2;
        const groundCenterZ = (trackBounds.minZ + trackBounds.maxZ) / 2;

        // Create grass ground
        const groundGeometry = new THREE.PlaneGeometry(groundWidth, groundDepth);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x4a6741 });
        ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(groundCenterX, 0, groundCenterZ);
        ground.receiveShadow = true;
        scene.add(ground);

        // Create water plane around grass
        const waterWidth = (trackBounds.maxX - trackBounds.minX) + (waterMargin * 2);
        const waterDepth = (trackBounds.maxZ - trackBounds.minZ) + (waterMargin * 2);
        const waterGeometry = new THREE.PlaneGeometry(waterWidth, waterDepth);
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x1e90ff,
            transparent: true,
            opacity: 0.7,
            metalness: 0.5,
            roughness: 0.3
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.rotation.x = -Math.PI / 2;
        water.position.set(groundCenterX, -0.1, groundCenterZ); // Slightly below grass
        water.receiveShadow = true;
        scene.add(water);

        // Create invisible collision walls at water boundaries (at the edge)
        const wallInset = 0;
        const wallHeight = 10;
        const wallThickness = 1;
        const waterColliders = [];

        const invisibleMaterial = new THREE.MeshBasicMaterial({ visible: false });

        // North wall (at grass edge)
        const northWall = new THREE.Mesh(
            new THREE.BoxGeometry(groundWidth, wallHeight, wallThickness),

        );
        northWall.position.set(
            groundCenterX,
            wallHeight / 2,
            groundCenterZ - groundDepth / 2
        );
        scene.add(northWall);
        waterColliders.push(northWall);

        // South wall (at grass edge)
        const southWall = new THREE.Mesh(
            new THREE.BoxGeometry(groundWidth, wallHeight, wallThickness),
            invisibleMaterial
        );
        southWall.position.set(
            groundCenterX,
            wallHeight / 2,
            groundCenterZ + groundDepth / 2
        );
        scene.add(southWall);
        waterColliders.push(southWall);

        // West wall (at grass edge)
        const westWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, wallHeight, groundDepth),
            invisibleMaterial
        );
        westWall.position.set(
            groundCenterX - groundWidth / 2,
            wallHeight / 2,
            groundCenterZ
        );
        scene.add(westWall);
        waterColliders.push(westWall);

        // East wall (at grass edge)
        const eastWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, wallHeight, groundDepth),
            invisibleMaterial
        );
        eastWall.position.set(
            groundCenterX + groundWidth / 2,
            wallHeight / 2,
            groundCenterZ
        );
        scene.add(eastWall);
        waterColliders.push(eastWall);

        // ===== ENVIRONMENT OBJECTS (TREES, ROCKS, BUSHES) =====
        const environmentColliders = [];

        // Check if a position is too close to any track
        function isPositionNearTrack(x, z, minDistance) {
            for (const [routeName, route] of Object.entries(trackRoutes)) {
                if (route) {
                    for (const piece of route) {
                        // Sample points along track piece
                        const samples = 10;
                        for (let i = 0; i <= samples; i++) {
                            const t = (i / samples) * piece.length;
                            const transform = piece.getTransformAt(t);
                            const dx = x - transform.position.x;
                            const dz = z - transform.position.z;
                            const distance = Math.sqrt(dx * dx + dz * dz);
                            if (distance < minDistance) {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        // Create a tree
        function createTree(x, z) {
            const treeGroup = new THREE.Group();

            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 3, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3520 });

        // Create a rock
        function createRock(x, z) {
            const size = 0.5 + Math.random() * 0.8;

            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });

        // Create a bush
        function createBush(x, z) {
            const bushGroup = new THREE.Group();
            const bushMaterial = new THREE.MeshStandardMaterial({ color: 0x3a6b35 });

            // Main bush sphere
            const bush1 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), bushMaterial);

        // Spawn environment objects randomly
        const numTrees = 30;
        const numRocks = 20;
        const numBushes = 40;
        const trackClearance = 8; // Minimum distance from tracks
        const objectSpacing = 3; // Minimum distance between objects
        const placedPositions = [];

        function isPositionClear(x, z) {
            // Check against already placed objects
            for (const pos of placedPositions) {
                const dx = x - pos.x;
                const dz = z - pos.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                if (distance < objectSpacing) {
                    return false;
                }
            }
            return true;
        }

        function tryPlaceObject(createFunc, maxAttempts = 50) {
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = groundCenterX - groundWidth / 2 + Math.random() * groundWidth;
                const z = groundCenterZ - groundDepth / 2 + Math.random() * groundDepth;

                if (!isPositionNearTrack(x, z, trackClearance) && isPositionClear(x, z)) {
                    createFunc(x, z);
                    placedPositions.push({ x, z });
                    return true;
                }
            }
            return false;
        }

        // Place trees
        for (let i = 0; i < numTrees; i++) {
            tryPlaceObject(createTree);
        }

        // Place rocks
        for (let i = 0; i < numRocks; i++) {
            tryPlaceObject(createRock);
        }

        // Place bushes
        for (let i = 0; i < numBushes; i++) {
            tryPlaceObject(createBush);
        }

        function renderTrackPiece(piece) {
            // For switcher pieces, render both paths
            if (piece.type === 'switcher') {
                renderTrackPath(piece.straightPath, 30);
                renderTrackPath(piece.alternatePath, 30);
                createPhysicalSwitch(piece);
                return;
            }
            renderTrackPath(piece, 30);

            // For final pieces, add a stop barrier at the end
            if (piece.type === 'final') {
                createStopBarrier(piece);
            }
        }

        function createStopBarrier(piece) {
            const endTransform = piece.getTransformAt(piece.length);
            const angle = Math.atan2(endTransform.direction.x, -endTransform.direction.z);

            // Red barrier bumper
            const barrierGeometry = new THREE.BoxGeometry(3.5, 1.0, 0.3);
            const barrierMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const barrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
            barrier.position.copy(endTransform.position);
            barrier.position.y = 0.5;
            barrier.rotation.y = -angle;
            barrier.castShadow = true;
            barrier.receiveShadow = true;
            scene.add(barrier);

            // Yellow/black striped warning stripes
            const stripeGeometry = new THREE.BoxGeometry(3.5, 0.2, 0.35);
            const stripeMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const stripe1 = new THREE.Mesh(stripeGeometry, stripeMaterial);
            stripe1.position.copy(endTransform.position);
            stripe1.position.y = 0.3;
            stripe1.rotation.y = -angle;
            scene.add(stripe1);

            const stripe2 = new THREE.Mesh(stripeGeometry, stripeMaterial);
            stripe2.position.copy(endTransform.position);
            stripe2.position.y = 0.7;
            stripe2.rotation.y = -angle;
            scene.add(stripe2);
        }

        function renderTrackPath(piece, numSegments) {
            for (let i = 0; i < numSegments; i++) {
                const t1 = (i / numSegments) * piece.length;
                const t2 = ((i + 1) / numSegments) * piece.length;

                const transform1 = piece.getTransformAt(t1);
                const transform2 = piece.getTransformAt(t2);

                const segmentLength = transform1.position.distanceTo(transform2.position);
                const midpoint = new THREE.Vector3().addVectors(transform1.position, transform2.position).multiplyScalar(0.5);
                const angle = Math.atan2(transform1.direction.x, -transform1.direction.z);

                const leftRailGeometry = new THREE.BoxGeometry(0.1, 0.15, segmentLength);
                const leftRail = new THREE.Mesh(leftRailGeometry, railMaterial);
                const leftOffset = new THREE.Vector3(-trackWidth / 2 * Math.cos(angle), 0, -trackWidth / 2 * Math.sin(angle));
                leftRail.position.copy(midpoint).add(leftOffset);
                leftRail.position.y = 0.075;
                leftRail.rotation.y = -angle;
                leftRail.receiveShadow = true;
                scene.add(leftRail);

                const rightRailGeometry = new THREE.BoxGeometry(0.1, 0.15, segmentLength);
                const rightRail = new THREE.Mesh(rightRailGeometry, railMaterial);
                const rightOffset = new THREE.Vector3(trackWidth / 2 * Math.cos(angle), 0, trackWidth / 2 * Math.sin(angle));
                rightRail.position.copy(midpoint).add(rightOffset);
                rightRail.position.y = 0.075;
                rightRail.rotation.y = -angle;
                rightRail.receiveShadow = true;
                scene.add(rightRail);

                const crosstie = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.2), trackMaterial);
                crosstie.position.copy(transform1.position);
                crosstie.position.y = 0.05;
                crosstie.rotation.y = -angle;
                crosstie.receiveShadow = true;
                scene.add(crosstie);
            }

            const finalTransform = piece.getTransformAt(piece.length);
            const finalAngle = Math.atan2(finalTransform.direction.x, -finalTransform.direction.z);
            const finalCrosstie = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.2), trackMaterial);
            finalCrosstie.position.copy(finalTransform.position);
            finalCrosstie.position.y = 0.05;
            finalCrosstie.rotation.y = finalAngle;
            finalCrosstie.receiveShadow = true;
            scene.add(finalCrosstie);
        }

        function createPhysicalSwitch(switcherPiece) {
            const switchGroup = new THREE.Group();

            // Base platform
            const baseGeometry = new THREE.BoxGeometry(0.6, 0.2, 0.6);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.castShadow = true;
            base.receiveShadow = true;
            switchGroup.add(base);

            // Switch lever
            const leverGroup = new THREE.Group();
            const leverHandleGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
            const leverHandleMaterial = new THREE.MeshStandardMaterial({ color: 0xff9800 });
            const leverHandle = new THREE.Mesh(leverHandleGeometry, leverHandleMaterial);
            leverHandle.position.y = 0.25;
            leverGroup.add(leverHandle);

            const leverKnobGeometry = new THREE.SphereGeometry(0.08, 8, 8);
            const leverKnob = new THREE.Mesh(leverKnobGeometry, leverHandleMaterial);
            leverKnob.position.y = 0.5;
            leverGroup.add(leverKnob);

            leverGroup.position.y = 0.1;
            switchGroup.add(leverGroup);

            // Position the switch at the start of the switcher piece, offset to the left
            const startTransform = switcherPiece.getTransformAt(0);
            const angle = Math.atan2(startTransform.direction.x, -startTransform.direction.z);

            // Calculate left offset perpendicular to track direction
            const leftOffset = new THREE.Vector3(
                -startTransform.direction.z * 2.5,  // Perpendicular to direction
                0,
                startTransform.direction.x * 2.5
            );

            switchGroup.position.copy(startTransform.position).add(leftOffset);
            switchGroup.position.y = 0.2;
            switchGroup.rotation.y = -angle;

            // Store reference to switcher piece and lever group
            switchGroup.userData = {
                isSwitch: true,
                switcherPiece: switcherPiece,
                leverGroup: leverGroup
            };

            scene.add(switchGroup);
            trackSwitches.push(switchGroup);

            // Initial lever position based on switch state
            updateSwitchVisual(switchGroup);
        }

        function updateSwitchVisual(switchGroup) {
            const switcherPiece = switchGroup.userData.switcherPiece;
            const leverGroup = switchGroup.userData.leverGroup;

            // Rotate lever based on state: straight = 0, alternate = 45 degrees
            if (switcherPiece.switchState === 'straight') {
                leverGroup.rotation.z = 0;
            } else {
                leverGroup.rotation.z = Math.PI / 4; // 45 degrees
            }
        }

        function toggleTrackSwitch(switcherPiece) {
            if (switcherPiece.switchState === 'straight') {
                switcherPiece.switchState = 'alternate';
            } else {
                switcherPiece.switchState = 'straight';
            }
        }

        function getTrackTransform(distance, routeName) {
            let remainingDistance = distance;
            const currentRoute = trackRoutes[routeName] || trackRoutes['main'];

            // Handle reverse transition: if going backward past start of branch route
            if (remainingDistance < 0 && routeName !== 'main' && routeParentInfo[routeName]) {
                const parentInfo = routeParentInfo[routeName];
                const parentRoute = trackRoutes[parentInfo.parentRoute];
                const switcher = parentInfo.switcherPiece;

                // Find the distance to the switcher on the parent route
                let distanceToSwitcher = 0;
                for (const piece of parentRoute) {
                    if (piece === switcher) {
                        // Position should be at the end of the alternate path (plus negative overshoot)
                        const newDistance = distanceToSwitcher + switcher.alternatePath.length + remainingDistance;
                        const result = getTrackTransform(newDistance, parentInfo.parentRoute);
                        result.newDistance = newDistance;
                        return result;
                    }
                    distanceToSwitcher += piece.length;
                }
            }

            // Calculate total length for this route
            let routeLength = 0;
            currentRoute.forEach(piece => {
                let pieceLength = piece.length;
                if (piece.type === 'switcher' && piece.switchState === 'alternate') {
                    pieceLength = piece.alternatePath.length;
                }
                routeLength += pieceLength;
            });

            for (let i = 0; i < currentRoute.length; i++) {
                const piece = currentRoute[i];

                // For switchers in alternate mode, use the alternate path length
                let effectiveLength = piece.length;
                if (piece.type === 'switcher' && piece.switchState === 'alternate') {
                    effectiveLength = piece.alternatePath.length;
                }

                if (remainingDistance <= effectiveLength) {
                    const transform = piece.getTransformAt(remainingDistance);
                    const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
                    // Return current piece type and distance within piece for deceleration logic
                    return {
                        position: transform.position,
                        rotation,
                        routeName,
                        currentPiece: piece,
                        distanceInPiece: remainingDistance
                    };
                }

                remainingDistance -= effectiveLength;

                // Check if this is a switcher and train should switch routes
                // Only switch if we've naturally progressed past the end of the alternate path
                if (piece.type === 'switcher' && piece.switchState === 'alternate' && piece.targetRoute && remainingDistance > 0) {
                    // Switch to the target route, continuing with remaining distance
                    const result = getTrackTransform(remainingDistance, piece.targetRoute);
                    result.newDistance = remainingDistance; // Pass the new distance back
                    return result;
                }
            }

            // If we've exhausted all pieces, stop at the last piece's end
            if (remainingDistance > 0 && currentRoute.length > 0) {
                const lastPiece = currentRoute[currentRoute.length - 1];
                const transform = lastPiece.getTransformAt(lastPiece.length);
                const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
                return { position: transform.position, rotation, routeName };
            }

            // Shouldn't reach here, but return route start as fallback
            const firstPiece = currentRoute[0];
            const transform = firstPiece.getTransformAt(0);
            const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
            return { position: transform.position, rotation, routeName };
        }

        let trainTrackDistance = 0;
        let cartTrackRoute = 'main';

        // ===== CARGO CART =====
        const cartGroup = new THREE.Group();
        scene.add(cartGroup);

        const cartColliders = [];
        const cartFloorMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        const cartWallMaterial = new THREE.MeshStandardMaterial({ color: 0x654321 });

        // Cart floor
        const cartFloorGeometry = new THREE.BoxGeometry(2.5, 0.2, 4);
        const cartFloor = new THREE.Mesh(cartFloorGeometry, cartFloorMaterial);
        cartFloor.position.y = 0.5;
        cartFloor.castShadow = true;
        cartFloor.receiveShadow = true;
        cartGroup.add(cartFloor);
        cartColliders.push(cartFloor);

        // Cart walls (low sides)
        const cartWallHeight = 0.6;

        const cartLeftWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, cartWallHeight, 4), cartWallMaterial);
        cartLeftWall.position.set(-1.175, 0.6 + cartWallHeight/2, 0);
        cartLeftWall.castShadow = true;
        cartGroup.add(cartLeftWall);
        cartColliders.push(cartLeftWall);

        const cartRightWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, cartWallHeight, 4), cartWallMaterial);
        cartRightWall.position.set(1.175, 0.6 + cartWallHeight/2, 0);
        cartRightWall.castShadow = true;
        cartGroup.add(cartRightWall);
        cartColliders.push(cartRightWall);

        const cartFrontWall = new THREE.Mesh(new THREE.BoxGeometry(2.5, cartWallHeight, 0.15), cartWallMaterial);
        cartFrontWall.position.set(0, 0.6 + cartWallHeight/2, -2);
        cartFrontWall.castShadow = true;
        cartGroup.add(cartFrontWall);
        cartColliders.push(cartFrontWall);

        const cartBackWall = new THREE.Mesh(new THREE.BoxGeometry(2.5, cartWallHeight, 0.15), cartWallMaterial);
        cartBackWall.position.set(0, 0.6 + cartWallHeight/2, 2);
        cartBackWall.castShadow = true;
        cartGroup.add(cartBackWall);
        cartColliders.push(cartBackWall);

        // Cart wheels
        const cartWheelPositions = [
            { x: -1.0, z: 1.2 },
            { x: 1.0, z: 1.2 },
            { x: -1.0, z: -1.2 },
            { x: 1.0, z: -1.2 }
        ];

        cartWheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos.x, 0.4, pos.z);
            wheel.castShadow = true;
            cartGroup.add(wheel);
        });

        // Coupling mechanism (visible connection point)
        const couplerGroup = new THREE.Group();
        const couplerMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });

        const couplerBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 8), couplerMaterial);
        couplerBase.rotation.z = Math.PI / 2;
        couplerBase.position.set(0, 0.6, -2.3);
        couplerGroup.add(couplerBase);

        couplerGroup.userData = { isCoupler: true };
        cartGroup.add(couplerGroup);

        // Position cart initially behind train
        const initialCartTransform = getTrackTransform(gameState.cartTrackDistance, cartTrackRoute);
        cartGroup.position.copy(initialCartTransform.position);
        cartGroup.rotation.y = -initialCartTransform.rotation;

        // ===== CONTROL PANEL =====
        const panelBoxGeometry = new THREE.BoxGeometry(1.5, 0.45, 0.6);
        const panelBoxMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const panelBox = new THREE.Mesh(panelBoxGeometry, panelBoxMaterial);
        panelBox.position.set(0, 0.625, -2.05);
        panelBox.castShadow = true;
        trainGroup.add(panelBox);

        const panelGeometry = new THREE.BoxGeometry(1.5, 0.15, 0.7);
        const panelMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        const controlPanel = new THREE.Mesh(panelGeometry, panelMaterial);
        controlPanel.position.set(0, 0.85, -1.95);
        controlPanel.rotation.x = Math.PI / 6;
        controlPanel.castShadow = true;
        trainGroup.add(controlPanel);

        const levers = [];

        function createLever(color, position, type) {
            const leverGroup = new THREE.Group();

            const baseGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.08, 8);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            leverGroup.add(base);

            const handleGeometry = new THREE.CylinderGeometry(0.025, 0.025, 0.25, 8);
            const handleMaterial = new THREE.MeshStandardMaterial({ color: color });
            const handle = new THREE.Mesh(handleGeometry, handleMaterial);
            handle.position.y = 0.125;
            leverGroup.add(handle);

            const knobGeometry = new THREE.SphereGeometry(0.04, 8, 8);
            const knob = new THREE.Mesh(knobGeometry, handleMaterial);
            knob.position.y = 0.25;
            leverGroup.add(knob);

            leverGroup.position.copy(position);
            leverGroup.userData = { type: type, isLever: true };

            trainGroup.add(leverGroup);
            levers.push(leverGroup);

            return leverGroup;
        }

        const yellowLever = createLever(0xf1c40f, new THREE.Vector3(-0.4, 0.95, -1.85), 'forward');
        const greenLever = createLever(0x2ecc71, new THREE.Vector3(0, 0.95, -1.85), 'reverse');
        const redLever = createLever(0xe74c3c, new THREE.Vector3(0.4, 0.95, -1.85), 'brake');

        // ===== PLAYER COLLISION BOX =====
        const playerBox = new THREE.Box3();
        const playerHeight = 1.6;
        const playerRadius = 0.3;

        // ===== RAYCASTER FOR INTERACTION =====
        const raycaster = new THREE.Raycaster();
        raycaster.far = 3;
        const interactionPrompt = document.getElementById('interaction-prompt');

        // ===== INPUT HANDLING =====
        const instructionsEl = document.getElementById('instructions');
        const pauseOverlay = document.getElementById('pause-overlay');

        document.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;

            // Toggle instructions with F
            if (e.code === 'KeyF') {
                gameState.showInstructions = !gameState.showInstructions;
                instructionsEl.style.display = gameState.showInstructions ? 'block' : 'none';
            }

            // Toggle pause with Escape
            if (e.code === 'Escape') {
                e.preventDefault();
                gameState.isPaused = !gameState.isPaused;
                pauseOverlay.style.display = gameState.isPaused ? 'block' : 'none';

                // Release pointer lock when paused, request it when unpaused
                if (gameState.isPaused) {
                    if (document.pointerLockElement) {
                        document.exitPointerLock();
                    }
                } else {
                    // Unpause - request pointer lock again
                    renderer.domElement.requestPointerLock();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.code] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                gameState.mouseMovement.x += e.movementX * 0.002;
                gameState.mouseMovement.y += e.movementY * 0.002;
                gameState.mouseMovement.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, gameState.mouseMovement.y));
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (document.pointerLockElement !== renderer.domElement) {
                renderer.domElement.requestPointerLock();
            } else {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

                // Check for train lever interactions
                const leverIntersects = raycaster.intersectObjects(levers, true);
                if (leverIntersects.length > 0) {
                    let leverObj = leverIntersects[0].object;
                    while (leverObj.parent && !leverObj.userData.isLever) {
                        leverObj = leverObj.parent;
                    }

                    if (leverObj.userData.isLever) {
                        toggleLever(leverObj.userData.type);
                        updateLeverVisuals(leverObj);
                        return;
                    }
                }

                // Check for track switch interactions
                const switchIntersects = raycaster.intersectObjects(trackSwitches, true);
                if (switchIntersects.length > 0) {
                    let switchObj = switchIntersects[0].object;
                    while (switchObj.parent && !switchObj.userData.isSwitch) {
                        switchObj = switchObj.parent;
                    }

                    if (switchObj.userData.isSwitch) {
                        const switcherPiece = switchObj.userData.switcherPiece;
                        toggleTrackSwitch(switcherPiece);
                        updateSwitchVisual(switchObj);
                        return;
                    }
                }

                // Check for coupler interaction (detach cart)
                if (gameState.cartAttached) {
                    const couplerIntersects = raycaster.intersectObjects(cartGroup.children, true);
                    if (couplerIntersects.length > 0) {
                        let couplerObj = couplerIntersects[0].object;
                        while (couplerObj.parent && !couplerObj.userData.isCoupler) {
                            couplerObj = couplerObj.parent;
                        }

                        if (couplerObj.userData.isCoupler) {
                            gameState.cartAttached = false;
                            console.log('Cart detached!');
                        }
                    }
                }
            }
        });

        // ===== LEVER MECHANICS =====
        function toggleLever(type) {
            if (type === 'forward') {
                gameState.levers.forward = !gameState.levers.forward;
                if (gameState.levers.forward) gameState.levers.reverse = false;
            } else if (type === 'reverse') {
                gameState.levers.reverse = !gameState.levers.reverse;
                if (gameState.levers.reverse) gameState.levers.forward = false;
            } else if (type === 'brake') {
                gameState.levers.brake = !gameState.levers.brake;
            }
        }

        function updateLeverVisuals(lever) {
            const type = lever.userData.type;
            const isOn = gameState.levers[type];
            lever.rotation.x = isOn ? Math.PI / 2 : 0.3;
        }

        yellowLever.rotation.x = 0.3;
        greenLever.rotation.x = 0.3;
        redLever.rotation.x = 0.3;

        // ===== PHYSICS & GAME LOOP =====
        function updateTrain(delta) {
            gameState.previousTrainPosition.copy(trainGroup.position);
            gameState.previousTrainRotation = trainGroup.rotation.y;

            if (!gameState.isOnTrain) {
                if (gameState.levers.forward || gameState.levers.reverse || gameState.levers.brake) {
                    gameState.levers.forward = false;
                    gameState.levers.reverse = false;
                    gameState.levers.brake = false;

                    updateLeverVisuals(yellowLever);
                    updateLeverVisuals(greenLever);
                    updateLeverVisuals(redLever);
                }

                if (Math.abs(gameState.trainVelocity) > 0.01) {
                    const stopDirection = gameState.trainVelocity > 0 ? -1 : 1;
                    gameState.trainVelocity += stopDirection * gameState.autoStopDeceleration;

                    if (Math.abs(gameState.trainVelocity) < 0.05) {
                        gameState.trainVelocity = 0;
                    }
                } else {
                    gameState.trainVelocity = 0;
                }
            } else {
                const targetSpeed = gameState.levers.forward ? gameState.trainMaxSpeed :
                                   gameState.levers.reverse ? -gameState.trainMaxSpeed : 0;

                if (gameState.levers.brake) {
                    if (Math.abs(gameState.trainVelocity) > 0.01) {
                        const brakeDirection = gameState.trainVelocity > 0 ? -1 : 1;
                        gameState.trainVelocity += brakeDirection * gameState.brakeDeceleration;
                    } else {
                        gameState.trainVelocity = 0;
                    }
                } else if (targetSpeed !== 0) {
                    if (Math.abs(gameState.trainVelocity - targetSpeed) > 0.1) {
                        gameState.trainVelocity += Math.sign(targetSpeed - gameState.trainVelocity) * gameState.trainAcceleration;
                    }
                } else {
                    if (Math.abs(gameState.trainVelocity) > 0.01) {
                        gameState.trainVelocity -= Math.sign(gameState.trainVelocity) * gameState.trainDeceleration;
                    } else {
                        gameState.trainVelocity = 0;
                    }
                }
            }

            trainTrackDistance -= gameState.trainVelocity * delta;
            const trackTransform = getTrackTransform(trainTrackDistance, currentTrackRoute);

            // Apply strong deceleration when on a final piece (approaching barrier)
            if (trackTransform.currentPiece && trackTransform.currentPiece.type === 'final') {
                // Calculate distance to the END of the final piece
                const distanceToEnd = trackTransform.currentPiece.length - trackTransform.distanceInPiece;

                // Only start decelerating when within 15 units of the barrier
                if (distanceToEnd < 15 && gameState.trainVelocity < 0) {
                    // Moving forward (negative velocity) - apply barrier deceleration
                    const barrierDeceleration = 0.4;
                    gameState.trainVelocity += barrierDeceleration;

                    // If very close to barrier (within 3 units of end), stop completely
                    if (distanceToEnd < 3) {
                        gameState.trainVelocity = 0;
                        gameState.levers.forward = false;
                        updateLeverVisuals(yellowLever);
                    }
                }
            }

            trainGroup.position.copy(trackTransform.position);
            trainGroup.rotation.y = -trackTransform.rotation;

            // Update current route if it changed
            if (trackTransform.routeName && trackTransform.routeName !== currentTrackRoute) {
                currentTrackRoute = trackTransform.routeName;
            }

            // Update cart position
            updateCart(delta);
        }

        function updateCart(delta) {
            if (gameState.cartAttached) {
                // When attached, cart follows train at fixed distance (7 units behind)
                const desiredCartDistance = trainTrackDistance - 7;

                // Check if train is on a final piece and stopped
                const trainTransform = getTrackTransform(trainTrackDistance, currentTrackRoute);
                const isTrainOnFinalPiece = trainTransform.currentPiece && trainTransform.currentPiece.type === 'final';

                if (isTrainOnFinalPiece && gameState.trainVelocity === 0) {
                    // Train stopped on final piece - only allow cart to move backwards (increase distance)
                    gameState.cartTrackDistance = desiredCartDistance;
                } else {
                    // Normal operation - cart follows train
                    gameState.cartTrackDistance = desiredCartDistance;
                }

                cartTrackRoute = currentTrackRoute;
            }

            // Update cart position on track
            const cartTransform = getTrackTransform(gameState.cartTrackDistance, cartTrackRoute);
            cartGroup.position.copy(cartTransform.position);
            cartGroup.rotation.y = -cartTransform.rotation;

            // Update cart route if it changed
            if (cartTransform.routeName && cartTransform.routeName !== cartTrackRoute) {
                cartTrackRoute = cartTransform.routeName;
            }

            // Check for player collision with cart to attach it
            if (!gameState.cartAttached) {
                const playerWorldPos = player.getWorldPosition(new THREE.Vector3());
                const distanceToCart = playerWorldPos.distanceTo(cartGroup.position);

                if (distanceToCart < 3) {
                    gameState.cartAttached = true;
                    console.log('Cart attached!');
                }
            }
        }

        function updatePlayer(delta) {
            camera.rotation.y = -gameState.mouseMovement.x;
            camera.rotation.x = -gameState.mouseMovement.y;

            const moveSpeed = 5;
            const moveDirection = new THREE.Vector3();

            // Calculate movement direction relative to camera
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
            );
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
            );

            if (gameState.keys['KeyW']) moveDirection.add(forward);
            if (gameState.keys['KeyS']) moveDirection.sub(forward);
            if (gameState.keys['KeyD']) moveDirection.add(right);
            if (gameState.keys['KeyA']) moveDirection.sub(right);

            if (moveDirection.length() > 0) {
                moveDirection.normalize();
                if (gameState.isOnTrain) {
                    // When on train, movement is in train's local space automatically
                    moveDirection.multiplyScalar(moveSpeed * delta);
                    player.position.x += moveDirection.x;
                    player.position.z += moveDirection.z;
                } else {
                    // When off train, use velocity
                    gameState.playerVelocity.x = moveDirection.x * moveSpeed;
                    gameState.playerVelocity.z = moveDirection.z * moveSpeed;
                }
            } else if (!gameState.isOnTrain) {
                gameState.playerVelocity.x *= 0.8;
                gameState.playerVelocity.z *= 0.8;
            }

            // Apply horizontal velocity when not on train
            if (!gameState.isOnTrain) {
                player.position.x += gameState.playerVelocity.x * delta;
                player.position.z += gameState.playerVelocity.z * delta;
            }

            // Apply gravity
            gameState.playerVelocity.y -= 25 * delta;

            // Jump
            if (gameState.keys['Space'] && gameState.canJump) {
                gameState.playerVelocity.y = 7;
                gameState.canJump = false;
            }

            player.position.y += gameState.playerVelocity.y * delta;

            // Collision detection with train - always work in train's local space
            let touchingFloor = false;

            // Get player position in train's local space
            const playerWorldPos = player.getWorldPosition(new THREE.Vector3());
            const playerLocalPos = trainGroup.worldToLocal(playerWorldPos.clone());

            for (const collider of trainColliders) {
                const colliderPos = collider.position.clone();
                const colliderScale = collider.scale.clone();
                const colliderGeometry = collider.geometry;
                const halfSize = new THREE.Vector3(
                    (colliderGeometry.parameters.width || 1) * colliderScale.x / 2,
                    (colliderGeometry.parameters.height || 1) * colliderScale.y / 2,
                    (colliderGeometry.parameters.depth || 1) * colliderScale.z / 2
                );

                const diff = new THREE.Vector3().subVectors(playerLocalPos, colliderPos);
                const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                    if (overlapX < overlapY && overlapX < overlapZ) {
                        playerLocalPos.x += overlapX * Math.sign(diff.x);
                        if (!gameState.isOnTrain) gameState.playerVelocity.x = 0;
                    } else if (overlapY < overlapZ) {
                        playerLocalPos.y += overlapY * Math.sign(diff.y);
                        gameState.playerVelocity.y = 0;
                        if (diff.y > 0) {
                            gameState.canJump = true;
                            if (collider === trainFloor || collider === balconyFloor) {
                                touchingFloor = true;
                            }
                        }
                    } else {
                        playerLocalPos.z += overlapZ * Math.sign(diff.z);
                        if (!gameState.isOnTrain) gameState.playerVelocity.z = 0;
                    }
                }
            }

            // Collision detection with cart (when attached)
            if (gameState.cartAttached) {
                const playerLocalPosCart = cartGroup.worldToLocal(playerWorldPos.clone());
                let cartCollisionDetected = false;

                for (const collider of cartColliders) {
                    const colliderPos = collider.position.clone();
                    const colliderScale = collider.scale.clone();
                    const colliderGeometry = collider.geometry;
                    const halfSize = new THREE.Vector3(
                        (colliderGeometry.parameters.width || 1) * colliderScale.x / 2,
                        (colliderGeometry.parameters.height || 1) * colliderScale.y / 2,
                        (colliderGeometry.parameters.depth || 1) * colliderScale.z / 2
                    );

                    const diff = new THREE.Vector3().subVectors(playerLocalPosCart, colliderPos);
                    const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                    const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                    const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                    if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                        cartCollisionDetected = true;
                        if (overlapX < overlapY && overlapX < overlapZ) {
                            playerLocalPosCart.x += overlapX * Math.sign(diff.x);
                            if (!gameState.isOnTrain) gameState.playerVelocity.x = 0;
                        } else if (overlapY < overlapZ) {
                            playerLocalPosCart.y += overlapY * Math.sign(diff.y);
                            gameState.playerVelocity.y = 0;
                            if (diff.y > 0) {
                                gameState.canJump = true;
                                if (collider === cartFloor) {
                                    touchingFloor = true;
                                }
                            }
                        } else {
                            playerLocalPosCart.z += overlapZ * Math.sign(diff.z);
                            if (!gameState.isOnTrain) gameState.playerVelocity.z = 0;
                        }
                    }
                }

                // Apply cart collision corrections by converting back to train space
                if (cartCollisionDetected) {
                    const cartPosInWorld = cartGroup.localToWorld(playerLocalPosCart.clone());
                    playerLocalPos.copy(trainGroup.worldToLocal(cartPosInWorld));
                }
            }

            // Check if player is inside the train cabin bounds (including balcony and attached cart)
            // Train cabin: x: -1.5 to 1.5, z: -2.4 to 4.1 (includes balcony)
            // Extended to z: 8.0 to cover gap when cart is attached
            let insideTrainBounds = playerLocalPos.x > -1.8 && playerLocalPos.x < 1.8 &&
                                     playerLocalPos.z > -2.7 && playerLocalPos.z < (gameState.cartAttached ? 8.0 : 4.5);

            // Also check if player is inside cart bounds when attached
            if (gameState.cartAttached && !insideTrainBounds) {
                const playerLocalPosCart = cartGroup.worldToLocal(playerWorldPos.clone());
                insideTrainBounds = playerLocalPosCart.x > -1.5 && playerLocalPosCart.x < 1.5 &&
                                   playerLocalPosCart.z > -2.5 && playerLocalPosCart.z < 2.5;
            }

            // Handle parenting and position updates correctly
            if (touchingFloor && !gameState.isOnTrain) {
                // Attach to train and update position in train's local space
                // Get the camera's current world rotation before attaching
                const cameraWorldQuaternion = new THREE.Quaternion();
                camera.getWorldQuaternion(cameraWorldQuaternion);
                const cameraWorldEuler = new THREE.Euler().setFromQuaternion(cameraWorldQuaternion, 'YXZ');

                trainGroup.attach(player);
                gameState.isOnTrain = true;
                player.position.copy(playerLocalPos);

                // Reset player rotation to zero in the train's local space
                player.rotation.set(0, 0, 0);

                // Calculate what mouseMovement.x should be to maintain the same world rotation
                // When on train: camera world rotation = trainGroup.rotation.y - gameState.mouseMovement.x
                // We want: trainGroup.rotation.y - newMouseMovement.x = cameraWorldEuler.y
                // So: newMouseMovement.x = trainGroup.rotation.y - cameraWorldEuler.y
                gameState.mouseMovement.x = trainGroup.rotation.y - cameraWorldEuler.y;
            } else if (!touchingFloor && gameState.isOnTrain && !insideTrainBounds) {
                // Detach from train only if player is outside the train bounds
                // This prevents detachment when jumping inside the train
                // Get the camera's actual world rotation using Three.js
                const cameraWorldQuaternion = new THREE.Quaternion();
                camera.getWorldQuaternion(cameraWorldQuaternion);
                const cameraWorldEuler = new THREE.Euler().setFromQuaternion(cameraWorldQuaternion, 'YXZ');

                scene.attach(player);
                gameState.isOnTrain = false;

                // Reset player rotation to zero (it's in world space now)
                player.rotation.set(0, 0, 0);

                // Update mouseMovement to maintain the world rotation
                gameState.mouseMovement.x = -cameraWorldEuler.y;
            } else if (gameState.isOnTrain) {
                // Already on train, just update local position
                player.position.copy(playerLocalPos);
            } else {
                // Not on train, convert corrected position back to world space
                const correctedWorldPos = trainGroup.localToWorld(playerLocalPos);
                player.position.copy(correctedWorldPos);
            }

            // Ground collision
            const playerWorldPos2 = player.getWorldPosition(new THREE.Vector3());
            const playerWorldY = playerWorldPos2.y;

            if (playerWorldY - playerHeight/2 <= 0) {
                if (gameState.isOnTrain) {
                    // If on train, set in local space
                    player.position.y = trainGroup.worldToLocal(new THREE.Vector3(0, playerHeight/2, 0)).y;
                } else {
                    // If not on train, set in world space
                    player.position.y = playerHeight/2;
                }
                gameState.playerVelocity.y = 0;
                gameState.canJump = true;
            }

            // Grass boundary collision (prevent player from entering water)
            if (!gameState.isOnTrain) {
                for (const wall of waterColliders) {
                    const wallPos = wall.position.clone();
                    const wallGeometry = wall.geometry;
                    const halfSize = new THREE.Vector3(
                        wallGeometry.parameters.width / 2,
                        wallGeometry.parameters.height / 2,
                        wallGeometry.parameters.depth / 2
                    );

                    const diff = new THREE.Vector3().subVectors(playerWorldPos2, wallPos);
                    const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                    const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                    const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                    if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                        if (overlapX < overlapZ) {
                            player.position.x += overlapX * Math.sign(diff.x);
                            gameState.playerVelocity.x = 0;
                        } else {
                            player.position.z += overlapZ * Math.sign(diff.z);
                            gameState.playerVelocity.z = 0;
                        }
                    }
                }
            }

            // Environment collision (trees, rocks, bushes) - only when not on train
            if (!gameState.isOnTrain) {
                for (const collider of environmentColliders) {
                    const colliderPos = collider.position.clone();
                    const colliderGeometry = collider.geometry;

                    // Handle both cylinder and sphere colliders
                    let radius, height;
                    if (colliderGeometry.parameters.radiusTop !== undefined) {
                        // Cylinder
                        radius = colliderGeometry.parameters.radiusTop;
                        height = colliderGeometry.parameters.height || 3;
                    } else if (colliderGeometry.parameters.radius !== undefined) {
                        // Sphere or dodecahedron
                        radius = colliderGeometry.parameters.radius;
                        height = radius * 2;
                    } else {
                        continue;
                    }

                    const diff = new THREE.Vector3().subVectors(playerWorldPos2, colliderPos);
                    const horizontalDistance = Math.sqrt(diff.x * diff.x + diff.z * diff.z);
                    const verticalOverlap = (height / 2 + playerHeight / 2) - Math.abs(diff.y);

                    if (horizontalDistance < radius + playerRadius && verticalOverlap > 0) {
                        // Push player away from collider center
                        const pushAngle = Math.atan2(diff.z, diff.x);
                        const pushDistance = (radius + playerRadius) - horizontalDistance;
                        player.position.x += Math.cos(pushAngle) * pushDistance;
                        player.position.z += Math.sin(pushAngle) * pushDistance;
                        gameState.playerVelocity.x *= 0.5;
                        gameState.playerVelocity.z *= 0.5;
                    }
                }
            }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Check for lever interactions
            const leverIntersects = raycaster.intersectObjects(levers, true);

            // Check for track switch interactions
            const switchIntersects = raycaster.intersectObjects(trackSwitches, true);

            if (leverIntersects.length > 0 || switchIntersects.length > 0) {
                interactionPrompt.style.display = 'block';
            } else {
                interactionPrompt.style.display = 'none';
            }
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Only update game state if not paused
            if (!gameState.isPaused) {
                updateTrain(delta);
                updatePlayer(delta);
            }

            renderer.render(scene, camera);
        }


        animate();

        // Fade out version display after 3 seconds
        setTimeout(() => {
            const versionEl = document.getElementById('version');
            versionEl.style.opacity = '0';
            setTimeout(() => versionEl.style.display = 'none', 1000);
        }, 3000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
