<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Driving Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
        }
        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            font-size: 16px;
        }
        #version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            opacity: 1;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructions">
        <strong>Controls:</strong><br>
        WASD - Move<br>
        Space - Jump<br>
        Mouse - Look Around<br>
        Click - Interact with Levers<br>
        <br>
        <strong>Levers:</strong><br>
        🟡 Yellow - Forward<br>
        🟢 Green - Reverse<br>
        🔴 Red - Brake
    </div>
    <div id="interaction-prompt">Click to Toggle</div>
    <div id="version">v1.8</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== GAME STATE =====
        const gameState = {
            keys: {},
            mouseMovement: { x: 0, y: 0 },
            playerVelocity: new THREE.Vector3(),
            isOnTrain: false,
            canJump: false,
            trainVelocity: 0,
            trainMaxSpeed: 15,
            trainAcceleration: 0.08,
            trainDeceleration: 0.05,
            brakeDeceleration: 0.15,
            autoStopDeceleration: 0.3,
            previousTrainPosition: new THREE.Vector3(),
            previousTrainRotation: 0,
            levers: {
                forward: false,
                reverse: false,
                brake: false
            }
        };

        // ===== SCENE SETUP =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';

        // Create player object and parent camera to it
        const player = new THREE.Object3D();
        player.position.set(0, 1.6, 5);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ===== LIGHTING =====
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // ===== GROUND =====
        const groundGeometry = new THREE.PlaneGeometry(300, 300);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x4a6741 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ===== TRAIN CONSTRUCTION =====
        const trainGroup = new THREE.Group();
        trainGroup.position.set(0, 0, 0);
        scene.add(trainGroup);

        const trainColliders = [];

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });

        // Front wall (with window opening)
        const frontWallBottom = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 0.2), wallMaterial);
        frontWallBottom.position.set(0, 0.55, -2.4);
        frontWallBottom.castShadow = true;
        frontWallBottom.receiveShadow = true;
        trainGroup.add(frontWallBottom);
        trainColliders.push(frontWallBottom);

        const frontWallTop = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 0.2), wallMaterial);
        frontWallTop.position.set(0, 2.05, -2.4);
        frontWallTop.castShadow = true;
        frontWallTop.receiveShadow = true;
        trainGroup.add(frontWallTop);
        trainColliders.push(frontWallTop);

        const frontWallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.2), wallMaterial);
        frontWallLeft.position.set(-1.2, 1.3, -2.4);
        frontWallLeft.castShadow = true;
        trainGroup.add(frontWallLeft);
        trainColliders.push(frontWallLeft);

        const frontWallRight = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.2), wallMaterial);
        frontWallRight.position.set(1.2, 1.3, -2.4);
        frontWallRight.castShadow = true;
        trainGroup.add(frontWallRight);
        trainColliders.push(frontWallRight);

        // Window frame
        const windowFrameMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const windowFrameTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.15), windowFrameMaterial);
        windowFrameTop.position.set(0, 1.75, -2.35);
        trainGroup.add(windowFrameTop);

        const windowFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.15), windowFrameMaterial);
        windowFrameBottom.position.set(0, 0.85, -2.35);
        trainGroup.add(windowFrameBottom);

        const windowFrameLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.0, 0.15), windowFrameMaterial);
        windowFrameLeft.position.set(-0.55, 1.3, -2.35);
        trainGroup.add(windowFrameLeft);

        const windowFrameRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.0, 0.15), windowFrameMaterial);
        windowFrameRight.position.set(0.55, 1.3, -2.35);
        trainGroup.add(windowFrameRight);

        // Back wall
        const backWallGeometry = new THREE.BoxGeometry(3, 2.0, 0.2);
        const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
        backWall.position.set(0, 1.3, 2.4);
        backWall.castShadow = true;
        backWall.receiveShadow = true;
        trainGroup.add(backWall);
        trainColliders.push(backWall);

        // Left wall (with door opening)
        const leftWallFront = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.0, 2), wallMaterial);
        leftWallFront.position.set(-1.5, 1.3, -1.4);
        leftWallFront.castShadow = true;
        trainGroup.add(leftWallFront);
        trainColliders.push(leftWallFront);

        const leftWallBack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.0, 2), wallMaterial);
        leftWallBack.position.set(-1.5, 1.3, 1.4);
        leftWallBack.castShadow = true;
        trainGroup.add(leftWallBack);
        trainColliders.push(leftWallBack);

        // Door frame
        const doorFrameGeometry = new THREE.BoxGeometry(0.15, 2.2, 0.1);
        const doorFrameMaterial = new THREE.MeshStandardMaterial({ color: 0xf39c12 });
        const doorFrameTop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 1.6), doorFrameMaterial);
        doorFrameTop.position.set(-1.5, 2.55, 0);
        trainGroup.add(doorFrameTop);

        const doorFrameLeft = new THREE.Mesh(doorFrameGeometry, doorFrameMaterial);
        doorFrameLeft.position.set(-1.5, 1.5, -0.75);
        trainGroup.add(doorFrameLeft);

        const doorFrameRight = new THREE.Mesh(doorFrameGeometry, doorFrameMaterial);
        doorFrameRight.position.set(-1.5, 1.5, 0.75);
        trainGroup.add(doorFrameRight);

        // Right wall (solid)
        const rightWallGeometry = new THREE.BoxGeometry(0.2, 2.0, 4.8);
        const rightWall = new THREE.Mesh(rightWallGeometry, wallMaterial);
        rightWall.position.set(1.5, 1.3, 0);
        rightWall.castShadow = true;
        rightWall.receiveShadow = true;
        trainGroup.add(rightWall);
        trainColliders.push(rightWall);

        // Cabin roof
        const roofGeometry = new THREE.BoxGeometry(3.2, 0.3, 5);
        const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.position.set(0, 2.45, 0);
        roof.castShadow = true;
        trainGroup.add(roof);
        trainColliders.push(roof);

        // Train floor
        const floorGeometry = new THREE.BoxGeometry(3, 0.2, 5);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
        const trainFloor = new THREE.Mesh(floorGeometry, floorMaterial);
        trainFloor.position.y = 0.3;
        trainFloor.castShadow = true;
        trainFloor.receiveShadow = true;
        trainGroup.add(trainFloor);
        trainColliders.push(trainFloor);

        // Wheels
        const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2c2c });
        const wheelPositions = [
            { x: -1.3, z: 1.5 },
            { x: 1.3, z: 1.5 },
            { x: -1.3, z: -1.5 },
            { x: 1.3, z: -1.5 }
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos.x, 0.4, pos.z);
            wheel.castShadow = true;
            trainGroup.add(wheel);
        });

        // ===== TRAIN TRACKS =====
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
        const railMaterial = new THREE.MeshStandardMaterial({ color: 0x707070 });
        const trackWidth = 2.6;

        class TrackPiece {
            constructor() {
                this.startPos = new THREE.Vector3();
                this.startDir = new THREE.Vector3(0, 0, -1);
                this.endPos = new THREE.Vector3();
                this.endDir = new THREE.Vector3(0, 0, -1);
                this.length = 0;
                this.type = 'straight';
            }

            getTransformAt(t) {
                const position = new THREE.Vector3();
                const direction = new THREE.Vector3();

                if (this.type === 'straight') {
                    const alpha = t / this.length;
                    position.lerpVectors(this.startPos, this.endPos, alpha);
                    direction.copy(this.startDir);
                } else if (this.type === 'curve') {
                    const alpha = t / this.length;
                    const angle = this.startAngle + (this.endAngle - this.startAngle) * alpha;
                    position.set(
                        this.center.x + this.radius * Math.cos(angle),
                        0,
                        this.center.z + this.radius * Math.sin(angle)
                    );
                    // Use exact same formula as endDir
                    const tangentAngle = angle + (this.turnAngle > 0 ? Math.PI / 2 : -Math.PI / 2);
                    direction.set(Math.cos(tangentAngle), 0, Math.sin(tangentAngle));
                }

                return { position, direction };
            }
        }

        function createStraightPiece(length, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'straight';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.length = length;
            piece.endPos.copy(startPos).add(piece.startDir.clone().multiplyScalar(length));
            piece.endDir.copy(piece.startDir);
            return piece;
        }

        function createCurvePiece(radius, angle, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'curve';
            piece.radius = radius;
            piece.turnAngle = angle;
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();

            const right = new THREE.Vector3(-startDir.z, 0, startDir.x).normalize();
            const turnDirection = angle > 0 ? 1 : -1;
            piece.center = startPos.clone().add(right.multiplyScalar(radius * turnDirection));

            const toStart = new THREE.Vector3().subVectors(startPos, piece.center);
            piece.startAngle = Math.atan2(toStart.z, toStart.x);
            piece.endAngle = piece.startAngle + angle;

            piece.length = Math.abs(radius * angle);

            piece.endPos.set(
                piece.center.x + radius * Math.cos(piece.endAngle),
                0,
                piece.center.z + radius * Math.sin(piece.endAngle)
            );
            const tangentAngle = piece.endAngle + (angle > 0 ? Math.PI / 2 : -Math.PI / 2);
            piece.endDir.set(Math.cos(tangentAngle), 0, Math.sin(tangentAngle));

            return piece;
        }

        // ===== TRACK CONFIGURATION =====
        // Track Definition: 1=straight, 2=right_curve, 3=left_curve
        // Edit this configuration to create your track layout
        const TRACK_CONFIG = {
            pattern: "1, 3, 1, 2, 1",
            straightLength: 50,
            curveRadius: 30,
            curveAngle: Math.PI / 2  // 90 degrees
        };

        // Parse and build track from configuration
        function buildTrackFromConfig(config) {
            const trackPieces = [];
            let currentPos = new THREE.Vector3(0, 0, 0);
            let currentDir = new THREE.Vector3(0, 0, -1);

            const segments = config.pattern.split(',').map(s => s.trim());

            segments.forEach(segment => {
                let piece;

                switch(segment) {
                    case '1': // Straight
                        piece = createStraightPiece(config.straightLength, currentPos, currentDir);
                        break;
                    case '2': // Right curve
                        piece = createCurvePiece(config.curveRadius, config.curveAngle, currentPos, currentDir);
                        break;
                    case '3': // Left curve
                        piece = createCurvePiece(config.curveRadius, -config.curveAngle, currentPos, currentDir);
                        break;
                    default:
                        console.warn(`Unknown track segment: ${segment}`);
                        return;
                }

                if (piece) {
                    trackPieces.push(piece);
                    currentPos.copy(piece.endPos);
                    currentDir.copy(piece.endDir);
                }
            });

            return trackPieces;
        }

        const trackPieces = buildTrackFromConfig(TRACK_CONFIG);

        function renderTrackPiece(piece) {
            const numSegments = 30;

            for (let i = 0; i < numSegments; i++) {
                const t1 = (i / numSegments) * piece.length;
                const t2 = ((i + 1) / numSegments) * piece.length;

                const transform1 = piece.getTransformAt(t1);
                const transform2 = piece.getTransformAt(t2);

                const segmentLength = transform1.position.distanceTo(transform2.position);
                const midpoint = new THREE.Vector3().addVectors(transform1.position, transform2.position).multiplyScalar(0.5);
                const angle = Math.atan2(transform1.direction.x, -transform1.direction.z);

                const leftRailGeometry = new THREE.BoxGeometry(0.1, 0.15, segmentLength);
                const leftRail = new THREE.Mesh(leftRailGeometry, railMaterial);
                const leftOffset = new THREE.Vector3(-trackWidth / 2 * Math.cos(angle), 0, -trackWidth / 2 * Math.sin(angle));
                leftRail.position.copy(midpoint).add(leftOffset);
                leftRail.position.y = 0.075;
                leftRail.rotation.y = -angle;
                leftRail.receiveShadow = true;
                scene.add(leftRail);

                const rightRailGeometry = new THREE.BoxGeometry(0.1, 0.15, segmentLength);
                const rightRail = new THREE.Mesh(rightRailGeometry, railMaterial);
                const rightOffset = new THREE.Vector3(trackWidth / 2 * Math.cos(angle), 0, trackWidth / 2 * Math.sin(angle));
                rightRail.position.copy(midpoint).add(rightOffset);
                rightRail.position.y = 0.075;
                rightRail.rotation.y = -angle;
                rightRail.receiveShadow = true;
                scene.add(rightRail);

                const crosstie = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.2), trackMaterial);
                crosstie.position.copy(transform1.position);
                crosstie.position.y = 0.05;
                crosstie.rotation.y = -angle;
                crosstie.receiveShadow = true;
                scene.add(crosstie);
            }

            const finalTransform = piece.getTransformAt(piece.length);
            const finalAngle = Math.atan2(finalTransform.direction.x, -finalTransform.direction.z);
            const finalCrosstie = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.2), trackMaterial);
            finalCrosstie.position.copy(finalTransform.position);
            finalCrosstie.position.y = 0.05;
            finalCrosstie.rotation.y = finalAngle;
            finalCrosstie.receiveShadow = true;
            scene.add(finalCrosstie);
        }

        trackPieces.forEach(piece => renderTrackPiece(piece));

        function getTrackTransform(distance) {
            let remainingDistance = distance;

            for (const piece of trackPieces) {
                if (remainingDistance <= piece.length) {
                    const transform = piece.getTransformAt(remainingDistance);
                    const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
                    return { position: transform.position, rotation };
                }
                remainingDistance -= piece.length;
            }

            const lastPiece = trackPieces[trackPieces.length - 1];
            const lastTransform = lastPiece.getTransformAt(lastPiece.length);
            const position = lastTransform.position.clone().add(
                lastTransform.direction.clone().multiplyScalar(remainingDistance)
            );
            const rotation = Math.atan2(lastTransform.direction.x, -lastTransform.direction.z);
            return { position, rotation };
        }

        let trainTrackDistance = 0;

        // ===== CONTROL PANEL =====
        const panelBoxGeometry = new THREE.BoxGeometry(1.5, 0.45, 0.6);
        const panelBoxMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const panelBox = new THREE.Mesh(panelBoxGeometry, panelBoxMaterial);
        panelBox.position.set(0, 0.625, -2.05);
        panelBox.castShadow = true;
        trainGroup.add(panelBox);

        const panelGeometry = new THREE.BoxGeometry(1.5, 0.15, 0.7);
        const panelMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        const controlPanel = new THREE.Mesh(panelGeometry, panelMaterial);
        controlPanel.position.set(0, 0.85, -1.95);
        controlPanel.rotation.x = Math.PI / 6;
        controlPanel.castShadow = true;
        trainGroup.add(controlPanel);

        const levers = [];

        function createLever(color, position, type) {
            const leverGroup = new THREE.Group();

            const baseGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.08, 8);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            leverGroup.add(base);

            const handleGeometry = new THREE.CylinderGeometry(0.025, 0.025, 0.25, 8);
            const handleMaterial = new THREE.MeshStandardMaterial({ color: color });
            const handle = new THREE.Mesh(handleGeometry, handleMaterial);
            handle.position.y = 0.125;
            leverGroup.add(handle);

            const knobGeometry = new THREE.SphereGeometry(0.04, 8, 8);
            const knob = new THREE.Mesh(knobGeometry, handleMaterial);
            knob.position.y = 0.25;
            leverGroup.add(knob);

            leverGroup.position.copy(position);
            leverGroup.userData = { type: type, isLever: true };

            trainGroup.add(leverGroup);
            levers.push(leverGroup);

            return leverGroup;
        }

        const yellowLever = createLever(0xf1c40f, new THREE.Vector3(-0.4, 0.95, -1.85), 'forward');
        const greenLever = createLever(0x2ecc71, new THREE.Vector3(0, 0.95, -1.85), 'reverse');
        const redLever = createLever(0xe74c3c, new THREE.Vector3(0.4, 0.95, -1.85), 'brake');

        // ===== PLAYER COLLISION BOX =====
        const playerBox = new THREE.Box3();
        const playerHeight = 1.6;
        const playerRadius = 0.3;

        // ===== RAYCASTER FOR INTERACTION =====
        const raycaster = new THREE.Raycaster();
        raycaster.far = 3;
        const interactionPrompt = document.getElementById('interaction-prompt');

        // ===== INPUT HANDLING =====
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.code] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                gameState.mouseMovement.x += e.movementX * 0.002;
                gameState.mouseMovement.y += e.movementY * 0.002;
                gameState.mouseMovement.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, gameState.mouseMovement.y));
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (document.pointerLockElement !== renderer.domElement) {
                renderer.domElement.requestPointerLock();
            } else {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(levers, true);

                if (intersects.length > 0) {
                    let leverObj = intersects[0].object;
                    while (leverObj.parent && !leverObj.userData.isLever) {
                        leverObj = leverObj.parent;
                    }

                    if (leverObj.userData.isLever) {
                        toggleLever(leverObj.userData.type);
                        updateLeverVisuals(leverObj);
                    }
                }
            }
        });

        // ===== LEVER MECHANICS =====
        function toggleLever(type) {
            if (type === 'forward') {
                gameState.levers.forward = !gameState.levers.forward;
                if (gameState.levers.forward) gameState.levers.reverse = false;
            } else if (type === 'reverse') {
                gameState.levers.reverse = !gameState.levers.reverse;
                if (gameState.levers.reverse) gameState.levers.forward = false;
            } else if (type === 'brake') {
                gameState.levers.brake = !gameState.levers.brake;
            }
        }

        function updateLeverVisuals(lever) {
            const type = lever.userData.type;
            const isOn = gameState.levers[type];
            lever.rotation.x = isOn ? Math.PI / 2 : 0.3;
        }

        yellowLever.rotation.x = 0.3;
        greenLever.rotation.x = 0.3;
        redLever.rotation.x = 0.3;

        // ===== PHYSICS & GAME LOOP =====
        function updateTrain(delta) {
            gameState.previousTrainPosition.copy(trainGroup.position);
            gameState.previousTrainRotation = trainGroup.rotation.y;

            if (!gameState.isOnTrain) {
                if (gameState.levers.forward || gameState.levers.reverse || gameState.levers.brake) {
                    gameState.levers.forward = false;
                    gameState.levers.reverse = false;
                    gameState.levers.brake = false;

                    updateLeverVisuals(yellowLever);
                    updateLeverVisuals(greenLever);
                    updateLeverVisuals(redLever);
                }

                if (Math.abs(gameState.trainVelocity) > 0.01) {
                    const stopDirection = gameState.trainVelocity > 0 ? -1 : 1;
                    gameState.trainVelocity += stopDirection * gameState.autoStopDeceleration;

                    if (Math.abs(gameState.trainVelocity) < 0.05) {
                        gameState.trainVelocity = 0;
                    }
                } else {
                    gameState.trainVelocity = 0;
                }
            } else {
                const targetSpeed = gameState.levers.forward ? gameState.trainMaxSpeed :
                                   gameState.levers.reverse ? -gameState.trainMaxSpeed : 0;

                if (gameState.levers.brake) {
                    if (Math.abs(gameState.trainVelocity) > 0.01) {
                        const brakeDirection = gameState.trainVelocity > 0 ? -1 : 1;
                        gameState.trainVelocity += brakeDirection * gameState.brakeDeceleration;
                    } else {
                        gameState.trainVelocity = 0;
                    }
                } else if (targetSpeed !== 0) {
                    if (Math.abs(gameState.trainVelocity - targetSpeed) > 0.1) {
                        gameState.trainVelocity += Math.sign(targetSpeed - gameState.trainVelocity) * gameState.trainAcceleration;
                    }
                } else {
                    if (Math.abs(gameState.trainVelocity) > 0.01) {
                        gameState.trainVelocity -= Math.sign(gameState.trainVelocity) * gameState.trainDeceleration;
                    } else {
                        gameState.trainVelocity = 0;
                    }
                }
            }

            trainTrackDistance -= gameState.trainVelocity * delta;
            const trackTransform = getTrackTransform(trainTrackDistance);
            trainGroup.position.copy(trackTransform.position);
            trainGroup.rotation.y = -trackTransform.rotation;
        }

        function updatePlayer(delta) {
            camera.rotation.y = -gameState.mouseMovement.x;
            camera.rotation.x = -gameState.mouseMovement.y;

            const moveSpeed = 5;
            const moveDirection = new THREE.Vector3();

            // Calculate movement direction relative to camera
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
            );
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
            );

            if (gameState.keys['KeyW']) moveDirection.add(forward);
            if (gameState.keys['KeyS']) moveDirection.sub(forward);
            if (gameState.keys['KeyD']) moveDirection.add(right);
            if (gameState.keys['KeyA']) moveDirection.sub(right);

            if (moveDirection.length() > 0) {
                moveDirection.normalize();
                if (gameState.isOnTrain) {
                    // When on train, movement is in train's local space automatically
                    moveDirection.multiplyScalar(moveSpeed * delta);
                    player.position.x += moveDirection.x;
                    player.position.z += moveDirection.z;
                } else {
                    // When off train, use velocity
                    gameState.playerVelocity.x = moveDirection.x * moveSpeed;
                    gameState.playerVelocity.z = moveDirection.z * moveSpeed;
                }
            } else if (!gameState.isOnTrain) {
                gameState.playerVelocity.x *= 0.8;
                gameState.playerVelocity.z *= 0.8;
            }

            // Apply horizontal velocity when not on train
            if (!gameState.isOnTrain) {
                player.position.x += gameState.playerVelocity.x * delta;
                player.position.z += gameState.playerVelocity.z * delta;
            }

            // Apply gravity
            gameState.playerVelocity.y -= 25 * delta;

            // Jump
            if (gameState.keys['Space'] && gameState.canJump) {
                gameState.playerVelocity.y = 7;
                gameState.canJump = false;
            }

            player.position.y += gameState.playerVelocity.y * delta;

            // Collision detection with train - always work in train's local space
            let touchingFloor = false;

            // Get player position in train's local space
            const playerWorldPos = player.getWorldPosition(new THREE.Vector3());
            const playerLocalPos = trainGroup.worldToLocal(playerWorldPos.clone());

            for (const collider of trainColliders) {
                const colliderPos = collider.position.clone();
                const colliderScale = collider.scale.clone();
                const colliderGeometry = collider.geometry;
                const halfSize = new THREE.Vector3(
                    (colliderGeometry.parameters.width || 1) * colliderScale.x / 2,
                    (colliderGeometry.parameters.height || 1) * colliderScale.y / 2,
                    (colliderGeometry.parameters.depth || 1) * colliderScale.z / 2
                );

                const diff = new THREE.Vector3().subVectors(playerLocalPos, colliderPos);
                const overlapX = halfSize.x + playerRadius - Math.abs(diff.x);
                const overlapY = halfSize.y + playerHeight / 2 - Math.abs(diff.y);
                const overlapZ = halfSize.z + playerRadius - Math.abs(diff.z);

                if (overlapX > 0 && overlapY > 0 && overlapZ > 0) {
                    if (overlapX < overlapY && overlapX < overlapZ) {
                        playerLocalPos.x += overlapX * Math.sign(diff.x);
                        if (!gameState.isOnTrain) gameState.playerVelocity.x = 0;
                    } else if (overlapY < overlapZ) {
                        playerLocalPos.y += overlapY * Math.sign(diff.y);
                        gameState.playerVelocity.y = 0;
                        if (diff.y > 0) {
                            gameState.canJump = true;
                            if (collider === trainFloor) {
                                touchingFloor = true;
                            }
                        }
                    } else {
                        playerLocalPos.z += overlapZ * Math.sign(diff.z);
                        if (!gameState.isOnTrain) gameState.playerVelocity.z = 0;
                    }
                }
            }

            // Handle parenting and position updates correctly
            if (touchingFloor && !gameState.isOnTrain) {
                // Attach to train and update position in train's local space
                trainGroup.attach(player);
                gameState.isOnTrain = true;
                player.position.copy(playerLocalPos);
            } else if (!touchingFloor && gameState.isOnTrain) {
                // Detach from train
                scene.attach(player);
                gameState.isOnTrain = false;
            } else if (gameState.isOnTrain) {
                // Already on train, just update local position
                player.position.copy(playerLocalPos);
            } else {
                // Not on train, convert corrected position back to world space
                const correctedWorldPos = trainGroup.localToWorld(playerLocalPos);
                player.position.copy(correctedWorldPos);
            }

            // Ground collision
            const playerWorldY = player.getWorldPosition(new THREE.Vector3()).y;
            if (playerWorldY - playerHeight/2 <= 0) {
                if (gameState.isOnTrain) {
                    // If on train, set in local space
                    player.position.y = trainGroup.worldToLocal(new THREE.Vector3(0, playerHeight/2, 0)).y;
                } else {
                    // If not on train, set in world space
                    player.position.y = playerHeight/2;
                }
                gameState.playerVelocity.y = 0;
                gameState.canJump = true;
            }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(levers, true);

            if (intersects.length > 0) {
                interactionPrompt.style.display = 'block';
            } else {
                interactionPrompt.style.display = 'none';
            }
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const delta = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            updateTrain(delta);
            updatePlayer(delta);

            renderer.render(scene, camera);
        }


        animate();

        // Fade out version display after 3 seconds
        setTimeout(() => {
            const versionEl = document.getElementById('version');
            versionEl.style.opacity = '0';
            setTimeout(() => versionEl.style.display = 'none', 1000);
        }, 3000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
