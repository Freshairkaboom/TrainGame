<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Driving Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.6;
        }
        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            font-size: 16px;
        }
        #version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            opacity: 1;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructions">
        <strong>Controls:</strong><br>
        WASD - Move<br>
        Space - Jump<br>
        Mouse - Look Around<br>
        Click - Interact with Levers & Switches<br>
        F - Toggle Instructions<br>
        Esc - Pause/Unpause<br>
        <br>
        <strong>Levers:</strong><br>
        🟡 Yellow - Reverse<br>
        🟢 Green - Forward<br>
        🔴 Red - Brake<br>
        <br>
        🟠 Track Switches - Change Routes
    </div>
    <div id="pause-overlay" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0, 0, 0, 0.9); padding: 30px 60px; border-radius: 10px; font-size: 32px; z-index: 100;">
        PAUSED
    </div>
    <div id="interaction-prompt">Click to Toggle</div>
    <div id="npc-dialogue" style="display: none; position: absolute; background: rgba(0, 0, 0, 0.85); color: white; padding: 12px 18px; border-radius: 8px; font-size: 16px; max-width: 300px; text-align: center; pointer-events: none; z-index: 50; border: 2px solid #ffd700;"></div>
    <div id="quest-display" style="display: none; position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.9); color: white; padding: 15px 20px; border-radius: 8px; font-size: 14px; min-width: 250px; z-index: 50; border-left: 4px solid #ffd700;">
        <div style="font-weight: bold; color: #ffd700; margin-bottom: 8px;">QUEST</div>
        <div id="quest-text"></div>
    </div>
    <div id="version">v1.10</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        const leftDoorFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.8), doorFrameMaterial);

        leftDoorFrameLeft.position.set(-1.325, 1.375, -0.4);
        trainGroup.add(leftDoorFrameLeft);

        rightWallBottom.castShadow = true;
        rightWallBottom.receiveShadow = true;
        trainGroup.add(rightWallBottom);
        trainColliders.push(rightWallBottom);

        const rightWallTop = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 4.8), wallMaterial);
        rightWallTop.position.set(1.2, 1.9, 0);
        rightWallTop.castShadow = true;
        rightWallTop.receiveShadow = true;
        trainGroup.add(rightWallTop);
        trainColliders.push(rightWallTop);

        const rightWallFront = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.48), wallMaterial);
        rightWallFront.position.set(1.2, 1.2, -2.16);
        rightWallFront.castShadow = true;
        trainGroup.add(rightWallFront);

        const rightWallBack = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.48), wallMaterial);

        rightWallBack.castShadow = true;

        trainColliders.push(rightWallBack);

        // Right window frame
        const rightWindowFrameTop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 3.84), windowFrameMaterial);
        rightWindowFrameTop.position.set(1.225, 1.45, 0);
        trainGroup.add(rightWindowFrameTop);

        const rightWindowFrameBottom = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 3.84), windowFrameMaterial);
        rightWindowFrameBottom.position.set(1.225, 0.95, 0);
        trainGroup.add(rightWindowFrameBottom);

        const rightWindowFrameFront = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.1), windowFrameMaterial);
        rightWindowFrameFront.position.set(1.225, 1.2, -1.92);
        trainGroup.add(rightWindowFrameFront);

        const rightWindowFrameBack = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.1), windowFrameMaterial);
        rightWindowFrameBack.position.set(1.225, 1.2, 1.92);
        trainGroup.add(rightWindowFrameBack);

        // Cabin roof
        const roofGeometry = new THREE.BoxGeometry(2.6, 0.3, 5);
        const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.position.set(0, 2.45, 0);
        roof.castShadow = true;
        trainGroup.add(roof);
        trainColliders.push(roof);

        // Train floor
        const floorGeometry = new THREE.BoxGeometry(2.4, 0.2, 5);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
        const trainFloor = new THREE.Mesh(floorGeometry, floorMaterial);
        trainFloor.position.y = 0.3;
        trainFloor.castShadow = true;
        trainFloor.receiveShadow = true;
        trainGroup.add(trainFloor);
        trainColliders.push(trainFloor);

        // Wheels
        const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x2c2c2c });
        const wheelPositions = [
            { x: -1.3, z: 1.5 },
            { x: 1.3, z: 1.5 },
            { x: -1.3, z: -1.5 },
            { x: 1.3, z: -1.5 }
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos.x, 0.4, pos.z);
            wheel.castShadow = true;
            trainGroup.add(wheel);
        });

        // ===== TRAIN TRACKS =====
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
        const railMaterial = new THREE.MeshStandardMaterial({ color: 0x707070 });
        const trackWidth = 2.6;

        class TrackPiece {
            constructor() {
                this.startPos = new THREE.Vector3();
                this.startDir = new THREE.Vector3(0, 0, -1);
                this.endPos = new THREE.Vector3();
                this.endDir = new THREE.Vector3(0, 0, -1);
                this.length = 0;
                this.type = 'straight';
                this.switchState = 'straight'; // For switcher pieces
                this.targetRoute = null; // For final pieces
            }

            getTransformAt(t) {
                const position = new THREE.Vector3();
                const direction = new THREE.Vector3();

                if (this.type === 'straight' || this.type === 'final' || this.type === 'station') {
                    const alpha = t / this.length;
                    position.lerpVectors(this.startPos, this.endPos, alpha);
                    direction.copy(this.startDir);
                } else if (this.type === 'curve') {
                    const alpha = t / this.length;
                    const angle = this.startAngle + (this.endAngle - this.startAngle) * alpha;
                    position.set(
                        this.center.x + this.radius * Math.cos(angle),
                        0,
                        this.center.z + this.radius * Math.sin(angle)
                    );
                    // Use exact same formula as endDir
                    const tangentAngle = angle + (this.turnAngle > 0 ? Math.PI / 2 : -Math.PI / 2);
                    direction.set(Math.cos(tangentAngle), 0, Math.sin(tangentAngle));
                } else if (this.type === 'switcher') {
                    // Use the active path based on switch state
                    const activePath = this.switchState === 'straight' ? this.straightPath : this.alternatePath;
                    return activePath.getTransformAt(t);
                }

                return { position, direction };
            }
        }

        function createStraightPiece(length, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'straight';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.length = length;
            piece.endPos.copy(startPos).add(piece.startDir.clone().multiplyScalar(length));
            piece.endDir.copy(piece.startDir);
            return piece;
        }

        function createCurvePiece(radius, angle, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'curve';
            piece.radius = radius;
            piece.turnAngle = angle;
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();

            const right = new THREE.Vector3(-startDir.z, 0, startDir.x).normalize();
            const turnDirection = angle > 0 ? 1 : -1;
            piece.center = startPos.clone().add(right.multiplyScalar(radius * turnDirection));

            const toStart = new THREE.Vector3().subVectors(startPos, piece.center);
            piece.startAngle = Math.atan2(toStart.z, toStart.x);
            piece.endAngle = piece.startAngle + angle;

            piece.length = Math.abs(radius * angle);

            piece.endPos.set(
                piece.center.x + radius * Math.cos(piece.endAngle),
                0,
                piece.center.z + radius * Math.sin(piece.endAngle)
            );
            const tangentAngle = piece.endAngle + (angle > 0 ? Math.PI / 2 : -Math.PI / 2);
            piece.endDir.set(Math.cos(tangentAngle), 0, Math.sin(tangentAngle));

            return piece;
        }

        function createFinalPiece(length, startPos, startDir, targetRoute = null) {
            const piece = new TrackPiece();
            piece.type = 'final';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.length = length;
            piece.endPos.copy(startPos).add(piece.startDir.clone().multiplyScalar(length));
            piece.endDir.copy(piece.startDir);
            piece.targetRoute = targetRoute;
            return piece;
        }

        function createStationPiece(length, startPos, startDir) {
            const piece = new TrackPiece();
            piece.type = 'station';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.length = length;
            piece.endPos.copy(startPos).add(piece.startDir.clone().multiplyScalar(length));
            piece.endDir.copy(piece.startDir);
            return piece;
        }

        function createSwitcherPiece(straightLength, curveRadius, curveAngle, startPos, startDir, targetRoute = null) {
            const piece = new TrackPiece();
            piece.type = 'switcher';
            piece.startPos.copy(startPos);
            piece.startDir.copy(startDir).normalize();
            piece.switchState = 'straight'; // Default to straight
            piece.targetRoute = targetRoute; // Which route the alternate path leads to

            // Create the straight path
            piece.straightPath = createStraightPiece(straightLength, startPos, startDir);

            // Create the alternate curved path
            piece.alternatePath = createCurvePiece(curveRadius, curveAngle, startPos, startDir);

            // Use straight path by default for end position/direction
            piece.length = piece.straightPath.length;
            piece.endPos.copy(piece.straightPath.endPos);
            piece.endDir.copy(piece.straightPath.endDir);

            return piece;
        }

        // ===== TRACK CONFIGURATION =====
        // Track Definition: 1=straight, 2=right_curve, 3=left_curve, 6=final piece
        // Switcher format: {type:4/5, targetRoute:'routeName'}
        // Final piece format: '6' - stops forward movement with red barrier (allows reverse)
        // Edit this configuration to create your track layout
        const TRACK_ROUTES = {
            main: {
                pattern: [
                    '1', '1',
                    {type: '4', targetRoute: 'branch'},  // Switcher that leads to branch route
                    '1', '1', '2', '1', '2', '1', '1', '1', '1', '1', '2', '1', '6'
                ],
                startPos: new THREE.Vector3(0, 0, 0),
                startDir: new THREE.Vector3(0, 0, -1)
            },
            branch: {
                pattern: ['1', '1', '1', '2', '2', '1', '1', '6'],
                // Start position will be set by the switcher
                startPos: null,
                startDir: null
            }
        };

        const TRACK_PARAMS = {
            straightLength: 50,
            curveRadius: 30,
            curveAngle: Math.PI / 2  // 90 degrees
        };

        // Array to hold all physical switch objects
        const trackSwitches = [];

        // Object to hold all track routes
        const trackRoutes = {};
        let currentTrackRoute = 'main';

        // Track parent relationships for bidirectional switching
        const routeParentInfo = {}; // Maps branch route name to {parentRoute, switcherPiece}

        // Parse and build track from pattern
        function buildRouteFromPattern(pattern, startPos, startDir, params, routeName = 'main') {
            const trackPieces = [];
            let currentPos = startPos.clone();
            let currentDir = startDir.clone();

            // Auto-add station piece at the start if not already present (only for main route)
            const hasStation = pattern.some(seg => (typeof seg === 'object' ? seg.type : seg) === '0');
            if (!hasStation && routeName === 'main') {
                pattern = ['0', ...pattern];
            }

            pattern.forEach(segment => {
                let piece;
                let segmentType = typeof segment === 'object' ? segment.type : segment;
                let targetRoute = typeof segment === 'object' ? segment.targetRoute : null;

                switch(segmentType) {
                    case '0': // Station
                        piece = createStationPiece(params.straightLength, currentPos, currentDir);
                        break;
                    case '1': // Straight
                        piece = createStraightPiece(params.straightLength, currentPos, currentDir);
                        break;
                    case '2': // Right curve
                        piece = createCurvePiece(params.curveRadius, params.curveAngle, currentPos, currentDir);
                        break;
                    case '3': // Left curve
                        piece = createCurvePiece(params.curveRadius, -params.curveAngle, currentPos, currentDir);
                        break;
                    case '4': // Switcher with right turn option
                        piece = createSwitcherPiece(params.straightLength, params.curveRadius, params.curveAngle, currentPos, currentDir, targetRoute);
                        break;
                    case '5': // Switcher with left turn option
                        piece = createSwitcherPiece(params.straightLength, params.curveRadius, -params.curveAngle, currentPos, currentDir, targetRoute);
                        break;
                    case '6': // Final piece (transition piece)
                        piece = createFinalPiece(params.straightLength, currentPos, currentDir, targetRoute);
                        break;
                    default:
                        console.warn(`Unknown track segment: ${segmentType}`);
                        return;
                }

                if (piece) {
                    trackPieces.push(piece);
                    currentPos.copy(piece.endPos);
                    currentDir.copy(piece.endDir);

                    // If this is a switcher with a target route, set up the branch route's start
                    if (piece.type === 'switcher' && piece.targetRoute && TRACK_ROUTES[piece.targetRoute]) {
                        TRACK_ROUTES[piece.targetRoute].startPos = piece.alternatePath.endPos.clone();
                        TRACK_ROUTES[piece.targetRoute].startDir = piece.alternatePath.endDir.clone();
                        // Store parent route info for reverse transitions
                        routeParentInfo[piece.targetRoute] = {
                            parentRoute: 'main',
                            switcherPiece: piece
                        };
                    }
                }
            });

            return trackPieces;
        }

        // Build all track routes
        for (const [routeName, routeConfig] of Object.entries(TRACK_ROUTES)) {
            if (routeConfig.startPos && routeConfig.startDir) {
                trackRoutes[routeName] = buildRouteFromPattern(
                    routeConfig.pattern,
                    routeConfig.startPos,
                    routeConfig.startDir,
                    TRACK_PARAMS,
                    routeName
                );
            }
        }

        // Build routes that depend on switchers (branch routes)
        for (const [routeName, routeConfig] of Object.entries(TRACK_ROUTES)) {
            if (!trackRoutes[routeName] && routeConfig.startPos && routeConfig.startDir) {
                trackRoutes[routeName] = buildRouteFromPattern(
                    routeConfig.pattern,
                    routeConfig.startPos,
                    routeConfig.startDir,
                    TRACK_PARAMS,
                    routeName
                );
            }
        }

        const trackPieces = trackRoutes['main'];

        // ===== ENVIRONMENT COLLIDERS ARRAY =====
        const environmentColliders = [];

        // Build a map of all track pieces to their routes for connection detection
        const pieceToRouteMap = new Map();
        for (const [routeName, route] of Object.entries(trackRoutes)) {
            if (route) {
                route.forEach((piece, index) => {
                    pieceToRouteMap.set(piece, { routeName, index });
                });
            }
        }

        // Render all track routes
        for (const [routeName, route] of Object.entries(trackRoutes)) {
            if (route) {
                route.forEach((piece, index) => {
                    renderTrackPiece(piece);
                    // Add start barrier to the very first piece of the main route
                    if (routeName === 'main' && index === 0) {
                        createStartBarrier(piece);
                    }
                });
            }
        }

        // ===== CREATE DYNAMIC GROUND BASED ON TRACK BOUNDS =====
        function calculateTrackBounds() {
            const bounds = {
                minX: Infinity,
                maxX: -Infinity,
                minZ: Infinity,
                maxZ: -Infinity
            };

            // Sample points along all track pieces to find bounds
            for (const [routeName, route] of Object.entries(trackRoutes)) {
                if (route) {
                    route.forEach(piece => {
                        // Sample multiple points along each piece
                        const samples = 20;
                        for (let i = 0; i <= samples; i++) {
                            const t = (i / samples) * piece.length;
                            const transform = piece.getTransformAt(t);
                            bounds.minX = Math.min(bounds.minX, transform.position.x);
                            bounds.maxX = Math.max(bounds.maxX, transform.position.x);
                            bounds.minZ = Math.min(bounds.minZ, transform.position.z);
                            bounds.maxZ = Math.max(bounds.maxZ, transform.position.z);
                        }
                    });
                }
            }

            return bounds;
        }

        const trackBounds = calculateTrackBounds();
        const grassMargin = 20; // 20 units grass margin in every direction
        const waterMargin = 50; // 50 units total (20 grass + 30 water)

        const groundWidth = (trackBounds.maxX - trackBounds.minX) + (grassMargin * 2);
        const groundDepth = (trackBounds.maxZ - trackBounds.minZ) + (grassMargin * 2);
        const groundCenterX = (trackBounds.minX + trackBounds.maxX) / 2;
        const groundCenterZ = (trackBounds.minZ + trackBounds.maxZ) / 2;

        // Create grass ground
        const groundGeometry = new THREE.PlaneGeometry(groundWidth, groundDepth);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x4a6741 });
        ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(groundCenterX, 0, groundCenterZ);
        ground.receiveShadow = true;
        scene.add(ground);

        // Create water plane around grass
        const waterWidth = (trackBounds.maxX - trackBounds.minX) + (waterMargin * 2);
        const waterDepth = (trackBounds.maxZ - trackBounds.minZ) + (waterMargin * 2);
        const waterGeometry = new THREE.PlaneGeometry(waterWidth, waterDepth);
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x1e90ff,
            transparent: true,
            opacity: 0.7,
            metalness: 0.5,
            roughness: 0.3
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.rotation.x = -Math.PI / 2;
        water.position.set(groundCenterX, -0.1, groundCenterZ); // Slightly below grass
        water.receiveShadow = true;
        scene.add(water);

        // Create invisible collision walls at water boundaries (at the edge)
        const wallInset = 0;
        const wallHeight = 10;
        const wallThickness = 1;
        const waterColliders = [];

        const invisibleMaterial = new THREE.MeshBasicMaterial({ visible: false });

        // North wall (at grass edge)
        const northWall = new THREE.Mesh(
            new THREE.BoxGeometry(groundWidth, wallHeight, wallThickness),
            invisibleMaterial
        );
        northWall.position.set(
            groundCenterX,
            wallHeight / 2,
            groundCenterZ - groundDepth / 2
        );
        scene.add(northWall);
        waterColliders.push(northWall);

        // South wall (at grass edge)
        const southWall = new THREE.Mesh(
            new THREE.BoxGeometry(groundWidth, wallHeight, wallThickness),
            invisibleMaterial
        );
        southWall.position.set(
            groundCenterX,
            wallHeight / 2,
            groundCenterZ + groundDepth / 2
        );
        scene.add(southWall);
        waterColliders.push(southWall);

        // West wall (at grass edge)
        const westWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, wallHeight, groundDepth),
            invisibleMaterial
        );
        westWall.position.set(
            groundCenterX - groundWidth / 2,
            wallHeight / 2,
            groundCenterZ
        );
        scene.add(westWall);
        waterColliders.push(westWall);

        // East wall (at grass edge)
        const eastWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThickness, wallHeight, groundDepth),
            invisibleMaterial
        );
        eastWall.position.set(
            groundCenterX + groundWidth / 2,
            wallHeight / 2,
            groundCenterZ
        );
        scene.add(eastWall);
        waterColliders.push(eastWall);

        // ===== ENVIRONMENT OBJECTS (TREES, ROCKS, BUSHES) =====

        // Check if a position is too close to any track
        function isPositionNearTrack(x, z, minDistance) {
            for (const [routeName, route] of Object.entries(trackRoutes)) {
                if (route) {
                    for (const piece of route) {
                        // Sample points along track piece
                        const samples = 10;
                        for (let i = 0; i <= samples; i++) {
                            const t = (i / samples) * piece.length;
                            const transform = piece.getTransformAt(t);
                            const dx = x - transform.position.x;
                            const dz = z - transform.position.z;
                            const distance = Math.sqrt(dx * dx + dz * dz);
                            if (distance < minDistance) {
                                return true;
                            }
                        }
                    }
                }
            }
            return false;
        }

        // Create a tree
        function createTree(x, z) {
            const treeGroup = new THREE.Group();

            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 3, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3520 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Foliage (3 spheres)
            const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x2d5016 });
            const foliage1 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), foliageMaterial);
            foliage1.position.y = 3.5;
            foliage1.castShadow = true;
            treeGroup.add(foliage1);

            const foliage2 = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), foliageMaterial);
            foliage2.position.set(0.8, 4, 0.5);
            foliage2.castShadow = true;
            treeGroup.add(foliage2);

            const foliage3 = new THREE.Mesh(new THREE.SphereGeometry(1.0, 8, 8), foliageMaterial);
            foliage3.position.set(-0.6, 4.2, -0.3);
            foliage3.castShadow = true;
            treeGroup.add(foliage3);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);

            // Add collision cylinder
            const collider = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.5, 3, 8),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            collider.position.set(x, 1.5, z);
            scene.add(collider);
            environmentColliders.push(collider);
        }

        // Create a rock
        function createRock(x, z) {
            const size = 0.5 + Math.random() * 0.8;
            const rockGeometry = new THREE.DodecahedronGeometry(size, 0);
            const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
            const rock = new THREE.Mesh(rockGeometry, rockMaterial);
            rock.position.set(x, size * 0.6, z);
            rock.rotation.set(
                Math.random() * Math.PI,
                Math.random() * Math.PI,
                Math.random() * Math.PI
            );
            rock.castShadow = true;
            rock.receiveShadow = true;
            scene.add(rock);
            environmentColliders.push(rock);
        }

        // Create a bush
        function createBush(x, z) {
            const bushGroup = new THREE.Group();
            const bushMaterial = new THREE.MeshStandardMaterial({ color: 0x3a6b35 });

            // Main bush sphere
            const bush1 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), bushMaterial);
            bush1.position.y = 0.6;
            bush1.scale.set(1, 0.8, 1);
            bush1.castShadow = true;
            bushGroup.add(bush1);

            // Additional smaller spheres for shape
            const bush2 = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), bushMaterial);
            bush2.position.set(0.4, 0.5, 0.3);
            bush2.scale.set(1, 0.8, 1);
            bush2.castShadow = true;
            bushGroup.add(bush2);

            const bush3 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), bushMaterial);
            bush3.position.set(-0.3, 0.4, -0.2);
            bush3.scale.set(1, 0.8, 1);
            bush3.castShadow = true;
            bushGroup.add(bush3);

            bushGroup.position.set(x, 0, z);
            scene.add(bushGroup);

            // Add collision sphere
            const collider = new THREE.Mesh(
                new THREE.SphereGeometry(1.0, 8, 8),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            collider.position.set(x, 0.6, z);
            scene.add(collider);
            environmentColliders.push(collider);
        }

        // Spawn environment objects randomly
        const numTrees = 30;
        const numRocks = 20;
        const numBushes = 40;
        const trackClearance = 8; // Minimum distance from tracks
        const objectSpacing = 3; // Minimum distance between objects
        const placedPositions = [];

        function isPositionClear(x, z) {
            // Check against already placed objects
            for (const pos of placedPositions) {
                const dx = x - pos.x;
                const dz = z - pos.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                if (distance < objectSpacing) {
                    return false;
                }
            }
            return true;
        }

        function tryPlaceObject(createFunc, maxAttempts = 50) {
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = groundCenterX - groundWidth / 2 + Math.random() * groundWidth;
                const z = groundCenterZ - groundDepth / 2 + Math.random() * groundDepth;

                if (!isPositionNearTrack(x, z, trackClearance) && isPositionClear(x, z)) {
                    createFunc(x, z);
                    placedPositions.push({ x, z });
                    return true;
                }
            }
            return false;
        }

        // Place trees
        for (let i = 0; i < numTrees; i++) {
            tryPlaceObject(createTree);
        }

        // Place rocks
        for (let i = 0; i < numRocks; i++) {
            tryPlaceObject(createRock);
        }

        // Place bushes
        for (let i = 0; i < numBushes; i++) {
            tryPlaceObject(createBush);
        }

        function renderTrackPiece(piece) {
            // For switcher pieces, render both paths
            if (piece.type === 'switcher') {
                renderTrackPath(piece.straightPath, 30);
                renderTrackPath(piece.alternatePath, 30);
                createPhysicalSwitch(piece);
                return;
            }

            // For station pieces, add platform and buildings
            if (piece.type === 'station') {
                renderTrackPath(piece, 30);
                createStation(piece);
                return;
            }

            renderTrackPath(piece, 30);

            // For final pieces, add a stop barrier at the end
            if (piece.type === 'final') {
                createStopBarrier(piece);
            }
        }

        function createStopBarrier(piece) {
            const endTransform = piece.getTransformAt(piece.length);
            const angle = Math.atan2(endTransform.direction.x, -endTransform.direction.z);

            // Red barrier bumper
            const barrierGeometry = new THREE.BoxGeometry(3.5, 1.0, 0.3);
            const barrierMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const barrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
            barrier.position.copy(endTransform.position);
            barrier.position.y = 0.5;
            barrier.rotation.y = -angle;
            barrier.castShadow = true;
            barrier.receiveShadow = true;
            scene.add(barrier);

            // Yellow/black striped warning stripes
            const stripeGeometry = new THREE.BoxGeometry(3.5, 0.2, 0.35);
            const stripeMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const stripe1 = new THREE.Mesh(stripeGeometry, stripeMaterial);
            stripe1.position.copy(endTransform.position);
            stripe1.position.y = 0.3;
            stripe1.rotation.y = -angle;
            scene.add(stripe1);

            const stripe2 = new THREE.Mesh(stripeGeometry, stripeMaterial);
            stripe2.position.copy(endTransform.position);
            stripe2.position.y = 0.7;
            stripe2.rotation.y = -angle;
            scene.add(stripe2);
        }

        function createStartBarrier(piece) {
            const startTransform = piece.getTransformAt(0);
            const angle = Math.atan2(startTransform.direction.x, -startTransform.direction.z);

            // Red barrier bumper at start
            const barrierGeometry = new THREE.BoxGeometry(3.5, 1.0, 0.3);
            const barrierMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const barrier = new THREE.Mesh(barrierGeometry, barrierMaterial);
            barrier.position.copy(startTransform.position);
            barrier.position.y = 0.5;
            barrier.rotation.y = -angle;
            barrier.castShadow = true;
            barrier.receiveShadow = true;
            scene.add(barrier);

            // Yellow/black striped warning stripes
            const stripeGeometry = new THREE.BoxGeometry(3.5, 0.2, 0.35);
            const stripeMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });

            const stripe1 = new THREE.Mesh(stripeGeometry, stripeMaterial);
            stripe1.position.copy(startTransform.position);
            stripe1.position.y = 0.3;
            stripe1.rotation.y = -angle;
            scene.add(stripe1);

            const stripe2 = new THREE.Mesh(stripeGeometry, stripeMaterial);
            stripe2.position.copy(startTransform.position);
            stripe2.position.y = 0.7;
            stripe2.rotation.y = -angle;
            scene.add(stripe2);
        }

        function createStation(piece) {
            const midTransform = piece.getTransformAt(piece.length / 2);
            const angle = Math.atan2(midTransform.direction.x, -midTransform.direction.z);

            // Calculate left side offset using cross product
            // Left = Up × Forward (right-hand rule)
            const forward = midTransform.direction.clone().normalize();
            const up = new THREE.Vector3(0, 1, 0);
            const leftDir = new THREE.Vector3().crossVectors(up, forward);

            // Platform - positioned on the left side (where train door is)
            const platformWidth = 4;
            const platformLength = piece.length * 0.8;
            const platformHeight = 0.3;
            const platformOffset = 4; // Distance from track center

            const platformGeometry = new THREE.BoxGeometry(platformWidth, platformHeight, platformLength);
            const platformMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);

            const platformPos = midTransform.position.clone();
            platformPos.add(leftDir.clone().multiplyScalar(platformOffset));
            platformPos.y = platformHeight / 2;

            platform.position.copy(platformPos);
            platform.rotation.y = -angle;
            platform.castShadow = true;
            platform.receiveShadow = true;
            scene.add(platform);

            // Add platform as a walkable collider (acts as a step/floor)
            const platformColliderGeometry = new THREE.BoxGeometry(platformWidth, platformHeight, platformLength);
            const platformCollider = new THREE.Mesh(platformColliderGeometry, new THREE.MeshBasicMaterial({ visible: false }));
            platformCollider.position.copy(platformPos);
            platformCollider.rotation.y = -angle;
            platformCollider.userData.isWalkable = true; // Mark as walkable surface
            scene.add(platformCollider);
            environmentColliders.push(platformCollider);

            // Platform edge/safety strip
            const edgeGeometry = new THREE.BoxGeometry(platformWidth, 0.05, platformLength);
            const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const edge = new THREE.Mesh(edgeGeometry, edgeMaterial);
            edge.position.copy(platformPos);
            edge.position.y = platformHeight + 0.025;
            edge.rotation.y = -angle;
            scene.add(edge);

            // Station Building 1 - Main building (proper structure with walls, floor, roof)
            const building1Width = 6;
            const building1Height = 4;
            const building1Depth = 8;
            const building1Offset = platformOffset + platformWidth / 2 + building1Width / 2;
            const wallThickness = 0.2;

            const building1Pos = midTransform.position.clone();
            building1Pos.add(leftDir.clone().multiplyScalar(building1Offset));
            building1Pos.y = building1Height / 2;

            const buildingMaterial = new THREE.MeshStandardMaterial({ color: 0xa0522d });

            // Floor - ground level (exterior foundation)
            const floorGeometry = new THREE.BoxGeometry(building1Width, 0.2, building1Depth);
            const floor = new THREE.Mesh(floorGeometry, buildingMaterial);
            floor.position.copy(building1Pos);
            floor.position.y = 0.1;
            floor.rotation.y = -angle;
            floor.receiveShadow = true;
            scene.add(floor);

            // Interior floor - at platform height (walkable surface inside building)
            const interiorFloorHeight = 0.1;
            const interiorFloorGeometry = new THREE.BoxGeometry(building1Width - wallThickness * 2, interiorFloorHeight, building1Depth - wallThickness * 2);
            const interiorFloorMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 }); // Brown wood color
            const interiorFloor = new THREE.Mesh(interiorFloorGeometry, interiorFloorMaterial);
            const interiorFloorPos = building1Pos.clone();
            interiorFloorPos.y = platformHeight - interiorFloorHeight / 2; // Match platform top at 0.3
            interiorFloor.position.copy(interiorFloorPos);
            interiorFloor.rotation.y = -angle;
            interiorFloor.receiveShadow = true;
            interiorFloor.userData.isWalkable = true;
            scene.add(interiorFloor);
            environmentColliders.push(interiorFloor);

            // Back wall (opposite from platform) - positioned at the back edge of floor
            const backWallGeometry = new THREE.BoxGeometry(wallThickness, building1Height, building1Depth);
            const backWall = new THREE.Mesh(backWallGeometry, buildingMaterial);
            const backWallPos = building1Pos.clone();
            backWallPos.add(leftDir.clone().multiplyScalar(building1Width / 2 + wallThickness / 2));
            backWall.position.copy(backWallPos);
            backWall.rotation.y = -angle;
            backWall.castShadow = true;
            backWall.receiveShadow = true;
            scene.add(backWall);
            environmentColliders.push(backWall);

            // Left side wall - positioned at the left edge of floor
            const sideWallGeometry = new THREE.BoxGeometry(building1Width, building1Height, wallThickness);
            const leftWall = new THREE.Mesh(sideWallGeometry, buildingMaterial);
            const leftWallPos = building1Pos.clone();
            leftWallPos.add(midTransform.direction.clone().multiplyScalar(-building1Depth / 2 - wallThickness / 2));
            leftWall.position.copy(leftWallPos);
            leftWall.rotation.y = -angle;
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            scene.add(leftWall);
            environmentColliders.push(leftWall);

            // Right side wall - positioned at the right edge of floor
            const rightWall = new THREE.Mesh(sideWallGeometry, buildingMaterial);
            const rightWallPos = building1Pos.clone();
            rightWallPos.add(midTransform.direction.clone().multiplyScalar(building1Depth / 2 + wallThickness / 2));
            rightWall.position.copy(rightWallPos);
            rightWall.rotation.y = -angle;
            rightWall.castShadow = true;
            rightWall.receiveShadow = true;
            scene.add(rightWall);
            environmentColliders.push(rightWall);

            // Front wall (facing platform) - split into sections around door
            const doorWidth = 1.5;
            const doorHeight = 2.2;

            // Front wall - left section (below and beside door)
            const frontLeftWidth = (building1Depth - doorWidth) / 2;
            const frontLeftGeometry = new THREE.BoxGeometry(wallThickness, building1Height, frontLeftWidth);
            const frontLeftWall = new THREE.Mesh(frontLeftGeometry, buildingMaterial);
            const frontLeftPos = building1Pos.clone();
            frontLeftPos.add(leftDir.clone().multiplyScalar(-building1Width / 2));
            frontLeftPos.add(midTransform.direction.clone().multiplyScalar(-building1Depth / 2 + frontLeftWidth / 2));
            frontLeftWall.position.copy(frontLeftPos);
            frontLeftWall.rotation.y = -angle;
            frontLeftWall.castShadow = true;
            frontLeftWall.receiveShadow = true;
            scene.add(frontLeftWall);
            environmentColliders.push(frontLeftWall);

            // Front wall - right section
            const frontRightWall = new THREE.Mesh(frontLeftGeometry, buildingMaterial);
            const frontRightPos = building1Pos.clone();
            frontRightPos.add(leftDir.clone().multiplyScalar(-building1Width / 2));
            frontRightPos.add(midTransform.direction.clone().multiplyScalar(building1Depth / 2 - frontLeftWidth / 2));
            frontRightWall.position.copy(frontRightPos);
            frontRightWall.rotation.y = -angle;
            frontRightWall.castShadow = true;
            frontRightWall.receiveShadow = true;
            scene.add(frontRightWall);
            environmentColliders.push(frontRightWall);

            // Front wall - top section (above door)
            const frontTopHeight = building1Height - doorHeight;
            const frontTopGeometry = new THREE.BoxGeometry(wallThickness, frontTopHeight, doorWidth);

        function renderTrackPath(piece, numSegments) {
            for (let i = 0; i < numSegments; i++) {
                const t1 = (i / numSegments) * piece.length;
                const t2 = ((i + 1) / numSegments) * piece.length;

                const transform1 = piece.getTransformAt(t1);
                const transform2 = piece.getTransformAt(t2);

                const segmentLength = transform1.position.distanceTo(transform2.position);
                const midpoint = new THREE.Vector3().addVectors(transform1.position, transform2.position).multiplyScalar(0.5);
                const angle = Math.atan2(transform1.direction.x, -transform1.direction.z);

                const leftRailGeometry = new THREE.BoxGeometry(0.1, 0.15, segmentLength);
                const leftRail = new THREE.Mesh(leftRailGeometry, railMaterial);
                const leftOffset = new THREE.Vector3(-trackWidth / 2 * Math.cos(angle), 0, -trackWidth / 2 * Math.sin(angle));
                leftRail.position.copy(midpoint).add(leftOffset);
                leftRail.position.y = 0.075;
                leftRail.rotation.y = -angle;
                leftRail.receiveShadow = true;
                scene.add(leftRail);

                const rightRailGeometry = new THREE.BoxGeometry(0.1, 0.15, segmentLength);
                const rightRail = new THREE.Mesh(rightRailGeometry, railMaterial);
                const rightOffset = new THREE.Vector3(trackWidth / 2 * Math.cos(angle), 0, trackWidth / 2 * Math.sin(angle));
                rightRail.position.copy(midpoint).add(rightOffset);
                rightRail.position.y = 0.075;
                rightRail.rotation.y = -angle;
                rightRail.receiveShadow = true;
                scene.add(rightRail);

                const crosstie = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.2), trackMaterial);
                crosstie.position.copy(transform1.position);
                crosstie.position.y = 0.05;
                crosstie.rotation.y = -angle;
                crosstie.receiveShadow = true;
                scene.add(crosstie);
            }

            const finalTransform = piece.getTransformAt(piece.length);
            const finalAngle = Math.atan2(finalTransform.direction.x, -finalTransform.direction.z);
            const finalCrosstie = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.2), trackMaterial);
            finalCrosstie.position.copy(finalTransform.position);
            finalCrosstie.position.y = 0.05;
            finalCrosstie.rotation.y = finalAngle;
            finalCrosstie.receiveShadow = true;
            scene.add(finalCrosstie);
        }

        function createPhysicalSwitch(switcherPiece) {
            const switchGroup = new THREE.Group();

            // Base platform
            const baseGeometry = new THREE.BoxGeometry(0.6, 0.2, 0.6);
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.castShadow = true;
            base.receiveShadow = true;
            switchGroup.add(base);

            // Switch lever
            const leverGroup = new THREE.Group();
            const leverHandleGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
            const leverHandleMaterial = new THREE.MeshStandardMaterial({ color: 0xff9800 });
            const leverHandle = new THREE.Mesh(leverHandleGeometry, leverHandleMaterial);
            leverHandle.position.y = 0.25;
            leverGroup.add(leverHandle);

            const leverKnobGeometry = new THREE.SphereGeometry(0.08, 8, 8);
            const leverKnob = new THREE.Mesh(leverKnobGeometry, leverHandleMaterial);
            leverKnob.position.y = 0.5;
            leverGroup.add(leverKnob);

            leverGroup.position.y = 0.1;
            switchGroup.add(leverGroup);

            // Position the switch at the start of the switcher piece, offset to the left
            const startTransform = switcherPiece.getTransformAt(0);
            const angle = Math.atan2(startTransform.direction.x, -startTransform.direction.z);

            // Calculate left offset perpendicular to track direction
            const leftOffset = new THREE.Vector3(
                -startTransform.direction.z * 2.5,  // Perpendicular to direction
                0,
                startTransform.direction.x * 2.5
            );

            switchGroup.position.copy(startTransform.position).add(leftOffset);
            switchGroup.position.y = 0.2;
            switchGroup.rotation.y = -angle;

            // Store reference to switcher piece and lever group
            switchGroup.userData = {
                isSwitch: true,
                switcherPiece: switcherPiece,
                leverGroup: leverGroup
            };

            scene.add(switchGroup);
            trackSwitches.push(switchGroup);

            // Initial lever position based on switch state
            updateSwitchVisual(switchGroup);
        }

        function updateSwitchVisual(switchGroup) {
            const switcherPiece = switchGroup.userData.switcherPiece;
            const leverGroup = switchGroup.userData.leverGroup;

            // Rotate lever based on state: straight = 0, alternate = 45 degrees
            if (switcherPiece.switchState === 'straight') {
                leverGroup.rotation.z = 0;
            } else {
                leverGroup.rotation.z = Math.PI / 4; // 45 degrees
            }
        }

        function toggleTrackSwitch(switcherPiece) {
            if (switcherPiece.switchState === 'straight') {

        function getTrackTransform(distance, routeName) {
            let remainingDistance = distance;
            const currentRoute = trackRoutes[routeName] || trackRoutes['main'];

            // Handle reverse transition: if going backward past start of branch route
            if (remainingDistance < 0 && routeName !== 'main' && routeParentInfo[routeName]) {
                const parentInfo = routeParentInfo[routeName];
                const parentRoute = trackRoutes[parentInfo.parentRoute];
                const switcher = parentInfo.switcherPiece;

                // Find the distance to the switcher on the parent route
                let distanceToSwitcher = 0;
                for (const piece of parentRoute) {
                    if (piece === switcher) {
                        // Return to the alternate path position on the parent route
                        // distanceToSwitcher is at the START of the switcher piece
                        // We need to add the alternate path length and the negative overshoot
                        const newDistance = distanceToSwitcher + switcher.alternatePath.length + remainingDistance;
                        const result = getTrackTransform(newDistance, parentInfo.parentRoute);
                        result.newDistance = newDistance;
                        result.routeChanged = true;
                        return result;
                    }
                    distanceToSwitcher += piece.length;
                }
            }

            // Calculate total length for this route
            let routeLength = 0;
            currentRoute.forEach(piece => {
                let pieceLength = piece.length;
                if (piece.type === 'switcher' && piece.switchState === 'alternate') {
                    pieceLength = piece.alternatePath.length;
                }
                routeLength += pieceLength;
            });

            for (let i = 0; i < currentRoute.length; i++) {
                const piece = currentRoute[i];

                // For switchers in alternate mode, use the alternate path length
                let effectiveLength = piece.length;
                if (piece.type === 'switcher' && piece.switchState === 'alternate') {
                    effectiveLength = piece.alternatePath.length;
                }

                if (remainingDistance <= effectiveLength) {
                    const transform = piece.getTransformAt(remainingDistance);
                    const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
                    // Return current piece type and distance within piece for deceleration logic
                    return {
                        position: transform.position,
                        rotation,
                        routeName,
                        currentPiece: piece,
                        distanceInPiece: remainingDistance
                    };
                }

                remainingDistance -= effectiveLength;

                // Check if this is a switcher and train should switch routes
                // Only switch if we've naturally progressed past the end of the alternate path
                if (piece.type === 'switcher' && piece.switchState === 'alternate' && piece.targetRoute && remainingDistance > 0) {
                    // Switch to the target route, continuing with remaining distance
                    const result = getTrackTransform(remainingDistance, piece.targetRoute);
                    result.newDistance = remainingDistance; // Pass the new distance back
                    result.routeChanged = true;
                    return result;
                }
            }

            // If we've exhausted all pieces, stop at the last piece's end
            if (remainingDistance > 0 && currentRoute.length > 0) {
                const lastPiece = currentRoute[currentRoute.length - 1];
                const transform = lastPiece.getTransformAt(lastPiece.length);
                const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
                return { position: transform.position, rotation, routeName };
            }

            // Shouldn't reach here, but return route start as fallback
            const firstPiece = currentRoute[0];
            const transform = firstPiece.getTransformAt(0);
            const rotation = Math.atan2(transform.direction.x, -transform.direction.z);
            return { position: transform.position, rotation, routeName };
        }

        let trainTrackDistance = 20; // Start at middle of station track

        const cartWheelPositions = [

        // Coupling mechanism (visible connection point)

        // ===== CONTROL PANEL =====
        const panelBoxGeometry = new THREE.BoxGeometry(1.5, 0.45, 0.6);
        const panelBoxMaterial = new THREE.MeshStandardMaterial({ color: 0x34495e });
        const panelBox = new THREE.Mesh(panelBoxGeometry, panelBoxMaterial);

        const levers = [];

        function createLever(color, position, type) {

            leverGroup.userData = { type: type, isLever: true };

            trainGroup.add(leverGroup);
            levers.push(leverGroup);

            return leverGroup;
        }

        const yellowLever = createLever(0xf1c40f, new THREE.Vector3(-0.4, 0.95, -1.85), 'forward');
        const greenLever = createLever(0x2ecc71, new THREE.Vector3(0, 0.95, -1.85), 'reverse');
        const redLever = createLever(0xe74c3c, new THREE.Vector3(0.4, 0.95, -1.85), 'brake');

        // ===== TRAIN HORN ROPE =====
        const hornRopeGroup = new THREE.Group();

        // Rope attachment point at ceiling
        const ropeAttachmentGeometry = new THREE.CylinderGeometry(0.03, 0.03, 0.05, 8);
        const ropeAttachmentMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
        const ropeAttachment = new THREE.Mesh(ropeAttachmentGeometry, ropeAttachmentMaterial);
        ropeAttachment.position.y = 2.4;
        hornRopeGroup.add(ropeAttachment);

        // Rope itself (multiple segments for realism)
        const ropeSegmentGeometry = new THREE.CylinderGeometry(0.015, 0.015, 0.2, 6);
        const ropeMaterial = new THREE.MeshStandardMaterial({ color: 0x8b4513 });

        for (let i = 0; i < 4; i++) {

            segment.position.y = 2.3 - (i * 0.2);
            hornRopeGroup.add(segment);
        }

        // Rope handle/pull ring
        const handleRingGeometry = new THREE.TorusGeometry(0.08, 0.02, 8, 12);
        const handleMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700 });
        const handleRing = new THREE.Mesh(handleRingGeometry, handleMaterial);
        handleRing.position.y = 1.5; // Eye level
        // Ring is vertical by default (no rotation needed)
        hornRopeGroup.add(handleRing);

        hornRopeGroup.position.set(0.55, 0, -1.85); // Directly to the right of levers
        hornRopeGroup.userData = { isHornRope: true };
        trainGroup.add(hornRopeGroup);

        // ===== TRAIN HORN AUDIO =====
        const hornAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        let hornOsc1 = null;
        let hornOsc2 = null;
        let hornGainNode = null;
        let isHornPlaying = false;

        function startTrainHorn() {
            if (isHornPlaying) return;
            isHornPlaying = true;

            const now = hornAudioContext.currentTime;

            // Create two oscillators for a realistic train horn sound
            hornOsc1 = hornAudioContext.createOscillator();
            hornOsc2 = hornAudioContext.createOscillator();
            hornGainNode = hornAudioContext.createGain();

            // Lower frequency for train horn (around 200-250 Hz)
            hornOsc1.frequency.setValueAtTime(220, now);
            hornOsc2.frequency.setValueAtTime(280, now);

            hornOsc1.type = 'triangle';
            hornOsc2.type = 'triangle';

            // Connect oscillators to gain node
            hornOsc1.connect(hornGainNode);
            hornOsc2.connect(hornGainNode);
            hornGainNode.connect(hornAudioContext.destination);

            // Quick attack to full volume
            hornGainNode.gain.setValueAtTime(0, now);
            hornGainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);

            hornOsc1.start(now);
            hornOsc2.start(now);
        }

        function stopTrainHorn() {
            if (!isHornPlaying) return;

            const now = hornAudioContext.currentTime;

            // Quick release
            if (hornGainNode) {
                hornGainNode.gain.linearRampToValueAtTime(0, now + 0.15);
            }

            // Stop oscillators after release
            setTimeout(() => {
                if (hornOsc1) hornOsc1.stop();
                if (hornOsc2) hornOsc2.stop();
                hornOsc1 = null;
                hornOsc2 = null;
                hornGainNode = null;
                isHornPlaying = false;
            }, 150);
        }

        // ===== PLAYER COLLISION BOX =====
        const playerBox = new THREE.Box3();
        const playerHeight = 1.6;
        const playerRadius = 0.3;

        // ===== RAYCASTER FOR INTERACTION =====
        const raycaster = new THREE.Raycaster();
        raycaster.far = 3;
        const interactionPrompt = document.getElementById('interaction-prompt');

        // Get quest DOM elements
        questElement = document.getElementById('quest-display');
        questTextElement = document.getElementById('quest-text');

        // Show initial greeting quest
        questActive = true;
        questTextElement.textContent = 'Say hello to the train station manager';
        questElement.style.display = 'block';

        // ===== INPUT HANDLING =====
        const instructionsEl = document.getElementById('instructions');
        const pauseOverlay = document.getElementById('pause-overlay');
        npcDialogueElement = document.getElementById('npc-dialogue');

        document.addEventListener('keydown', (e) => {

                instructionsEl.style.display = gameState.showInstructions ? 'block' : 'none';

            // Toggle pause with Escape

                e.preventDefault();
                gameState.isPaused = !gameState.isPaused;
                pauseOverlay.style.display = gameState.isPaused ? 'block' : 'none';

                // Release pointer lock when paused, request it when unpaused

        renderer.domElement.addEventListener('click', () => {

                                if (questActive && !cartQuestCompleted) {

                // Check for coupler interaction (grab/release or detach)
                const couplerIntersects = raycaster.intersectObjects(cartGroup.children, true);
